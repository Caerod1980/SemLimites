<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SemLimites Prestadores</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #f8fafc, #ffffff);
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <script>
        const { useState, useEffect } = React;

        // CONSTANTES
        const ESTADOS = ["AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"];
        const CATEGORIAS = ["Eletricista", "Encanador", "Diarista", "Pedreiro", "Montador de Móveis", "Ar-condicionado", "Pintor", "Jardineiro", "Marceneiro", "Vidraceiro"];
        const API_URL = 'https://semlimites-api-rodrigo-b5ckghhkbxdqd7a8.canadacentral-01.azurewebsites.net/api';
        const BASE_PATH = '/SemLimites';

        // COMPONENTES UI
        const Stars = (props) => {
            const value = props.value || 0;
            const size = props.size || "md";
            const sizeClasses = { sm: "text-sm", md: "text-base", lg: "text-xl", xl: "text-2xl" };
            
            return React.createElement('div', { className: "flex items-center gap-1" },
                React.createElement('div', { className: "flex" },
                    [1,2,3,4,5].map(i => 
                        React.createElement('span', { 
                            key: i, 
                            className: (i <= value ? 'text-amber-400' : 'text-slate-200') + ' ' + (sizeClasses[size] || '')
                        }, "★")
                    )
                ),
                React.createElement('span', { className: "ml-1 text-sm font-semibold text-slate-700" }, value.toFixed(1))
            );
        };

        const Avatar = (props) => {
            const name = props.name || "";
            const size = props.size || "md";
            const sizeClasses = { sm: "w-8 h-8 text-xs", md: "w-10 h-10 text-sm", lg: "w-12 h-12 text-base", xl: "w-16 h-16 text-lg", xxl: "w-24 h-24 text-2xl" };
            const colors = ["from-blue-500 to-indigo-600", "from-emerald-500 to-teal-600", "from-amber-500 to-orange-600", "from-rose-500 to-pink-600"];
            const initials = name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
            
            return React.createElement('div', { 
                className: "rounded-2xl bg-gradient-to-br flex items-center justify-center font-semibold text-white shadow-md " + 
                           colors[name.length % colors.length] + " " + 
                           sizeClasses[size] 
            }, initials);
        };

        // COMPONENTES PRINCIPAIS
        function App() {
            const [modo, setModo] = useState('busca');
            const [usuario, setUsuario] = useState(null);
            const [prestadorSelecionado, setPrestadorSelecionado] = useState(null);

            window.appSetModo = setModo;

            useEffect(() => {
                const token = localStorage.getItem('token');
                if (token) {
                    fetch(API_URL + '/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    })
                    .then(r => r.json())
                    .then(data => { if (!data.error) setUsuario(data); })
                    .catch(console.error);
                }
            }, []);

            const voltarParaBusca = () => navigate('/');
            const handleVerPerfil = (p) => { setPrestadorSelecionado(p); navigate('/perfil'); };
            const handleLoginSuccess = () => navigate('/dashboard');
            const handleCadastroSucesso = () => navigate('/');
            const handleSair = () => { localStorage.removeItem('token'); setUsuario(null); navigate('/'); };

            const navigate = (path) => {
                window.history.pushState({}, '', BASE_PATH + path);
                if (path.startsWith('/avaliar/')) setModo('avaliar');
                else if (path === '/login') setModo('login');
                else if (path === '/cadastro') setModo('cadastro');
                else if (path === '/dashboard') setModo('dashboard');
                else if (path === '/perfil') setModo('perfil');
                else setModo('busca');
            };

            const header = modo !== 'avaliar' ? React.createElement('header', { className: "bg-white/90 backdrop-blur-lg border-b border-slate-200 sticky top-0 z-50" },
                React.createElement('div', { className: "max-w-7xl mx-auto px-4 py-3 flex justify-between items-center" },
                    React.createElement('div', { onClick: voltarParaBusca, className: "flex items-center gap-3 cursor-pointer" },
                        React.createElement('div', { className: "w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-600 to-indigo-700 text-white grid place-items-center font-bold" }, "SL"),
                        React.createElement('h1', { className: "font-bold text-lg" }, "SemLimites")
                    ),
                    React.createElement('div', { className: "flex gap-3" },
                        React.createElement('button', {
                            onClick: () => navigate(usuario ? '/dashboard' : '/login'),
                            className: usuario ? "px-4 py-2 rounded-xl bg-indigo-600 text-white" : "px-4 py-2 rounded-xl border border-slate-200 hover:bg-slate-50"
                        }, usuario ? 'Dashboard' : 'Entrar'),
                        React.createElement('button', {
                            onClick: () => navigate(modo === 'busca' ? '/cadastro' : '/'),
                            className: "px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-700 text-white"
                        }, modo === 'busca' ? 'Sou Prestador' : 'Ver Busca')
                    )
                )
            ) : null;

            let content;
            if (modo === 'busca') content = React.createElement(TelaBusca, { onVerPerfil: handleVerPerfil });
            else if (modo === 'perfil') content = React.createElement(TelaPerfil, { prestador: prestadorSelecionado, onVoltar: voltarParaBusca });
            else if (modo === 'login') content = React.createElement(Login, { onLoginSuccess: handleLoginSuccess, onVoltar: voltarParaBusca });
            else if (modo === 'cadastro') content = React.createElement(CadastroPrestador, { onCadastroSucesso: handleCadastroSucesso, onVoltar: voltarParaBusca });
            else if (modo === 'dashboard') content = React.createElement(DashboardPrestador, { usuario: usuario, onSair: handleSair });
            else if (modo === 'avaliar') content = React.createElement(AvaliarServico);

            return React.createElement('div', { className: "min-h-screen bg-gradient-to-b from-slate-50 to-white" }, header, content);
        }

        // TELA DE BUSCA
        const TelaBusca = (props) => {
            const [estado, setEstado] = useState('');
            const [cidade, setCidade] = useState('');
            const [categoria, setCategoria] = useState('');
            const [buscaTexto, setBuscaTexto] = useState('');
            const [resultados, setResultados] = useState([]);
            const [loading, setLoading] = useState(false);
            const [erro, setErro] = useState('');

            useEffect(() => {
                const timer = setTimeout(() => {
                    setLoading(true);
                    const params = [];
                    if (estado) params.push('estado=' + encodeURIComponent(estado));
                    if (cidade) params.push('cidade=' + encodeURIComponent(cidade));
                    if (categoria) params.push('categoria=' + encodeURIComponent(categoria));
                    if (buscaTexto) params.push('q=' + encodeURIComponent(buscaTexto));
                    params.push('limit=12');
                    
                    fetch(API_URL + '/prestadores/busca?' + params.join('&'))
                        .then(r => r.json())
                        .then(data => {
                            setResultados(data.prestadores || []);
                            setLoading(false);
                        })
                        .catch(err => {
                            setErro(err.message);
                            setLoading(false);
                        });
                }, 500);
                return () => clearTimeout(timer);
            }, [estado, cidade, categoria, buscaTexto]);

            return React.createElement('div', { className: "max-w-7xl mx-auto px-4 py-8" },
                React.createElement('div', { className: "bg-white rounded-2xl border border-slate-200 p-6 mb-6" },
                    React.createElement('h1', { className: "text-2xl font-bold text-slate-900 mb-4" }, "Encontre profissionais em todo Brasil"),
                    React.createElement('div', { className: "grid md:grid-cols-4 gap-4" },
                        React.createElement('select', { value: estado, onChange: (e) => { setEstado(e.target.value); setCidade(''); }, className: "px-4 py-2 rounded-xl border border-slate-200" },
                            React.createElement('option', { value: "" }, "Todos os estados"),
                            ESTADOS.map(uf => React.createElement('option', { key: uf, value: uf }, uf))
                        ),
                        React.createElement('input', { type: "text", value: cidade, onChange: (e) => setCidade(e.target.value), placeholder: "Cidade", className: "px-4 py-2 rounded-xl border border-slate-200" }),
                        React.createElement('select', { value: categoria, onChange: (e) => setCategoria(e.target.value), className: "px-4 py-2 rounded-xl border border-slate-200" },
                            React.createElement('option', { value: "" }, "Todas as categorias"),
                            CATEGORIAS.map(c => React.createElement('option', { key: c, value: c }, c))
                        ),
                        React.createElement('input', { type: "text", value: buscaTexto, onChange: (e) => setBuscaTexto(e.target.value), placeholder: "Buscar...", className: "px-4 py-2 rounded-xl border border-slate-200" })
                    )
                ),
                loading && React.createElement('div', { className: "text-center py-8" },
                    React.createElement('div', { className: "w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4" }),
                    React.createElement('p', { className: "text-slate-600" }, "Buscando...")
                ),
                erro && React.createElement('div', { className: "text-red-600 text-center py-8" }, erro),
                !loading && !erro && React.createElement('div', { className: "grid md:grid-cols-2 lg:grid-cols-3 gap-6" },
                    resultados.length === 0 ?
                        React.createElement('div', { key: "empty", className: "col-span-full text-center py-12 text-slate-500" }, "Nenhum prestador encontrado") :
                        resultados.map(p => React.createElement(CardPrestador, { key: p._id, prestador: p, onVerPerfil: props.onVerPerfil }))
                )
            );
        };

        // CARD PRESTADOR
        const CardPrestador = (props) => {
            const p = props.prestador;
            return React.createElement('div', { className: "bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-lg transition-all hover:border-indigo-200" },
                React.createElement('div', { className: "flex items-start gap-4" },
                    React.createElement(Avatar, { name: p.nome, size: "lg" }),
                    React.createElement('div', { className: "flex-1" },
                        React.createElement('h3', { className: "font-bold text-lg text-slate-900" }, p.nome),
                        React.createElement('p', { className: "text-sm text-slate-500 mt-1" }, (p.categoria || 'Profissional') + ' • ' + (p.cidade || '') + (p.estado ? ' - ' + p.estado : '')),
                        React.createElement('div', { className: "flex items-center gap-2 mt-2" },
                            React.createElement(Stars, { value: p.estrelas || 0 }),
                            React.createElement('span', { className: "text-xs text-slate-500" }, '(' + (p.avaliacoes || 0) + ' avaliações)')
                        ),
                        React.createElement('p', { className: "mt-3 text-sm text-slate-600 line-clamp-2" }, p.descricao || 'Sem descrição'),
                        React.createElement('button', { onClick: () => props.onVerPerfil(p), className: "mt-4 px-4 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 text-sm font-medium" }, "Ver perfil")
                    )
                )
            );
        };

        // TELA DE PERFIL
        const TelaPerfil = (props) => {
            const p = props.prestador;
            const onVoltar = props.onVoltar;

            return React.createElement('div', { className: "max-w-7xl mx-auto px-4 py-8" },
                React.createElement('button', { onClick: onVoltar, className: "mb-6 text-indigo-600 hover:text-indigo-800 flex items-center gap-2" },
                    React.createElement('svg', { className: "w-5 h-5", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
                        React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M10 19l-7-7m0 0l7-7m-7 7h18" })
                    ),
                    "Voltar para busca"
                ),
                React.createElement('div', { className: "bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm" },
                    React.createElement('div', { className: "bg-gradient-to-r from-indigo-600 to-indigo-700 p-8 text-white" },
                        React.createElement('div', { className: "flex items-center gap-6" },
                            React.createElement(Avatar, { name: p.nome, size: "xxl" }),
                            React.createElement('div', null,
                                React.createElement('h1', { className: "text-3xl font-bold mb-2" }, p.nome),
                                React.createElement('p', { className: "text-indigo-100" }, (p.categoria || 'Categoria') + ' • ' + (p.cidade || '') + (p.estado ? ' - ' + p.estado : '')),
                                React.createElement('div', { className: "flex items-center gap-2 mt-3" },
                                    React.createElement(Stars, { value: p.estrelas || 0, size: "lg" }),
                                    React.createElement('span', { className: "text-sm text-indigo-200" }, '(' + (p.avaliacoes || 0) + ' avaliações)')
                                )
                            )
                        )
                    ),
                    React.createElement('div', { className: "p-8 space-y-6" },
                        p.descricao && React.createElement('div', null,
                            React.createElement('h2', { className: "text-xl font-semibold mb-3" }, "Sobre"),
                            React.createElement('p', { className: "text-slate-600 leading-relaxed" }, p.descricao)
                        ),
                        React.createElement('div', { className: "bg-slate-50 rounded-2xl p-6" },
                            React.createElement('h2', { className: "text-xl font-semibold mb-4" }, "Contato"),
                            React.createElement('div', { className: "space-y-3" },
                                p.whatsapp && React.createElement('div', { className: "flex items-center gap-3" },
                                    React.createElement('svg', { className: "w-5 h-5 text-emerald-600", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
                                        React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" })
                                    ),
                                    React.createElement('a', { href: 'https://wa.me/' + p.whatsapp, target: "_blank", className: "text-emerald-700 hover:text-emerald-900" }, p.whatsapp)
                                ),
                                p.telefone && React.createElement('div', { className: "flex items-center gap-3" },
                                    React.createElement('svg', { className: "w-5 h-5 text-slate-500", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
                                        React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" })
                                    ),
                                    React.createElement('span', { className: "text-slate-700" }, p.telefone)
                                )
                            )
                        )
                    )
                )
            );
        };

        // LOGIN
        const Login = (props) => {
            const [email, setEmail] = useState('');
            const [senha, setSenha] = useState('');
            const [tipo, setTipo] = useState('cliente');
            const [modo, setModo] = useState('login');
            const [loading, setLoading] = useState(false);
            const [erro, setErro] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setLoading(true);
                fetch(API_URL + (modo === 'login' ? '/auth/login' : '/auth/register'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(modo === 'login' ? { email, senha, tipo } : { email, senha, tipo, nome: email.split('@')[0] })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    if (modo === 'login') {
                        localStorage.setItem('token', data.token);
                        props.onLoginSuccess();
                    } else {
                        alert('Cadastro realizado! Faça login.');
                        setModo('login');
                    }
                    setLoading(false);
                })
                .catch(err => { setErro(err.message); setLoading(false); });
            };

            return React.createElement('div', { className: "max-w-md mx-auto px-4 py-12" },
                React.createElement('div', { className: "bg-white rounded-3xl border border-slate-200 p-8 shadow-sm" },
                    React.createElement('div', { className: "flex items-center justify-between mb-6" },
                        React.createElement('h1', { className: "text-2xl font-bold" }, modo === 'login' ? 'Entrar' : 'Criar conta'),
                        React.createElement('button', { onClick: props.onVoltar, className: "text-sm text-slate-500 hover:text-indigo-600" }, "← Voltar")
                    ),
                    erro && React.createElement('div', { className: "mb-4 p-3 rounded-lg bg-red-50 border border-red-200" },
                        React.createElement('p', { className: "text-sm text-red-600" }, erro)
                    ),
                    React.createElement('form', { onSubmit: handleSubmit, className: "space-y-4" },
                        React.createElement('div', null,
                            React.createElement('label', { className: "block text-sm font-medium mb-1" }, "Tipo de conta"),
                            React.createElement('div', { className: "flex gap-4" },
                                ['cliente', 'prestador'].map(t => 
                                    React.createElement('label', { key: t, className: "flex items-center gap-2" },
                                        React.createElement('input', { type: "radio", value: t, checked: tipo === t, onChange: () => setTipo(t), className: "w-4 h-4 text-indigo-600" }),
                                        React.createElement('span', { className: "text-sm" }, t === 'cliente' ? 'Cliente' : 'Prestador')
                                    )
                                )
                            )
                        ),
                        React.createElement('div', null,
                            React.createElement('label', { className: "block text-sm font-medium mb-1" }, "E-mail"),
                            React.createElement('input', { type: "email", value: email, onChange: (e) => setEmail(e.target.value), className: "w-full px-4 py-3 rounded-xl border border-slate-200", required: true })
                        ),
                        React.createElement('div', null,
                            React.createElement('label', { className: "block text-sm font-medium mb-1" }, "Senha"),
                            React.createElement('input', { type: "password", value: senha, onChange: (e) => setSenha(e.target.value), className: "w-full px-4 py-3 rounded-xl border border-slate-200", required: true, minLength: 6 })
                        ),
                        React.createElement('button', { type: "submit", disabled: loading, className: "w-full px-6 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-700 text-white font-semibold disabled:opacity-50" },
                            loading ? 'Processando...' : (modo === 'login' ? 'Entrar' : 'Cadastrar')
                        ),
                        React.createElement('div', { className: "text-center mt-4" },
                            React.createElement('button', { type: "button", onClick: () => setModo(modo === 'login' ? 'registro' : 'login'), className: "text-sm text-indigo-600 hover:text-indigo-800" },
                                modo === 'login' ? 'Não tem conta? Cadastre-se' : 'Já tem conta? Faça login'
                            )
                        )
                    )
                )
            );
        };

        // AVALIAR SERVIÇO
        const AvaliarServico = () => {
            const token = window.location.pathname.split('/').pop();
            const [loading, setLoading] = useState(true);
            const [erro, setErro] = useState('');
            const [servico, setServico] = useState(null);
            const [estrelas, setEstrelas] = useState(0);
            const [comentario, setComentario] = useState('');
            const [emailConfirmacao, setEmailConfirmacao] = useState('');
            const [emailConfirmado, setEmailConfirmado] = useState(false);
            const [enviando, setEnviando] = useState(false);
            const [enviado, setEnviado] = useState(false);

            useEffect(() => {
                fetch(API_URL + '/servicos/avaliar/' + token)
                    .then(r => r.json())
                    .then(data => {
                        if (data.servico) setServico(data.servico);
                        else setErro(data.error || 'Link inválido');
                        setLoading(false);
                    })
                    .catch(err => { setErro(err.message); setLoading(false); });
            }, [token]);

            const handleVerificarEmail = () => {
                if (emailConfirmacao.toLowerCase().trim() === servico.clienteEmail.toLowerCase().trim()) {
                    setEmailConfirmado(true);
                    setErro('');
                } else {
                    setErro('E-mail não corresponde ao cadastrado');
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                setEnviando(true);
                fetch(API_URL + '/servicos/avaliar/' + token, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estrelas, comentario, email: emailConfirmacao })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) setEnviado(true);
                    else setErro(data.error || 'Erro ao enviar');
                    setEnviando(false);
                })
                .catch(err => { setErro(err.message); setEnviando(false); });
            };

            if (loading) return React.createElement('div', { className: "min-h-screen flex items-center justify-center" },
                React.createElement('div', { className: "w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin" })
            );

            if (erro || !servico) return React.createElement('div', { className: "min-h-screen flex items-center justify-center p-4" },
                React.createElement('div', { className: "max-w-md bg-white rounded-3xl border border-slate-200 p-8 text-center" },
                    React.createElement('h2', { className: "text-2xl font-bold text-red-600 mb-4" }, "Link inválido"),
                    React.createElement('p', { className: "text-slate-600 mb-6" }, erro || 'Link não encontrado'),
                    React.createElement('button', { onClick: () => navigate('/'), className: "px-6 py-3 bg-indigo-600 text-white rounded-xl" }, "Página inicial")
                )
            );

            if (enviado) return React.createElement('div', { className: "min-h-screen flex items-center justify-center p-4" },
                React.createElement('div', { className: "max-w-md bg-white rounded-3xl border border-slate-200 p-8 text-center" },
                    React.createElement('h2', { className: "text-2xl font-bold text-green-600 mb-3" }, "Avaliação enviada!"),
                    React.createElement('p', { className: "text-slate-600" }, "Obrigado pela sua contribuição.")
                )
            );

            return React.createElement('div', { className: "min-h-screen bg-gradient-to-b from-slate-50 to-white p-4" },
                React.createElement('div', { className: "max-w-3xl mx-auto" },
                    React.createElement('div', { className: "bg-white rounded-3xl border border-slate-200 p-8 shadow-sm" },
                        React.createElement('h2', { className: "text-3xl font-bold text-center mb-8" }, "Avalie o serviço"),
                        !emailConfirmado ?
                            React.createElement('div', { className: "space-y-4" },
                                React.createElement('p', { className: "text-sm text-slate-600" }, "Confirme seu e-mail para avaliar:"),
                                React.createElement('input', { type: "email", value: emailConfirmacao, onChange: (e) => setEmailConfirmacao(e.target.value), className: "w-full px-4 py-3 rounded-xl border border-slate-200", placeholder: "seu@email.com" }),
                                React.createElement('button', { onClick: handleVerificarEmail, className: "w-full px-6 py-3 bg-amber-600 text-white rounded-xl" }, "Verificar e-mail")
                            ) :
                            React.createElement('form', { onSubmit: handleSubmit, className: "space-y-6" },
                                React.createElement('div', { className: "flex justify-center gap-2" },
                                    [1,2,3,4,5].map(v => 
                                        React.createElement('button', { key: v, type: "button", onClick: () => setEstrelas(v), className: "focus:outline-none" },
                                            React.createElement('svg', { className: "w-10 h-10 " + (v <= estrelas ? 'text-amber-400' : 'text-slate-300'), fill: "currentColor", viewBox: "0 0 24 24" },
                                                React.createElement('path', { d: "M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" })
                                            )
                                        )
                                    )
                                ),
                                React.createElement('textarea', { value: comentario, onChange: (e) => setComentario(e.target.value), placeholder: "Comentário (opcional)", rows: 4, className: "w-full px-4 py-3 rounded-xl border border-slate-200" }),
                                React.createElement('button', { type: "submit", disabled: enviando || estrelas === 0, className: "w-full px-6 py-4 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white rounded-xl disabled:opacity-50" },
                                    enviando ? 'Enviando...' : 'Enviar avaliação'
                                )
                            )
                    )
                )
            );
        };

        // DASHBOARD (simplificado)
        const DashboardPrestador = (props) => {
            const [prestador, setPrestador] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                fetch(API_URL + '/prestadores/perfil', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                })
                .then(r => r.json())
                .then(data => { setPrestador(data); setLoading(false); })
                .catch(err => { console.error(err); setLoading(false); });
            }, []);

            if (loading) return React.createElement('div', { className: "max-w-7xl mx-auto px-4 py-12 text-center" },
                React.createElement('div', { className: "w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4" }),
                React.createElement('p', null, "Carregando...")
            );

            return React.createElement('div', { className: "max-w-7xl mx-auto px-4 py-8" },
                React.createElement('div', { className: "bg-gradient-to-r from-indigo-600 to-indigo-700 rounded-3xl p-8 text-white mb-8 flex justify-between items-start" },
                    React.createElement('div', null,
                        React.createElement('h1', { className: "text-3xl font-bold mb-2" }, "Olá, " + (prestador?.nome || 'Prestador') + "!"),
                        React.createElement('p', null, "Gerencie seus serviços e reputação")
                    ),
                    React.createElement('button', { onClick: props.onSair, className: "px-4 py-2 bg-white/20 hover:bg-white/30 rounded-xl" }, "Sair")
                )
            );
        };

        // CADASTRO (simplificado)
        const CadastroPrestador = (props) => {
            const [formData, setFormData] = useState({ nome: '', email: '', senha: '', categoria: '', cidade: '', estado: 'SP', whatsapp: '' });
            const [loading, setLoading] = useState(false);
            const [erro, setErro] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setLoading(true);
                fetch(API_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...formData, tipo: 'prestador' })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    alert('Cadastro realizado! Faça login.');
                    props.onCadastroSucesso();
                })
                .catch(err => { setErro(err.message); setLoading(false); });
            };

            return React.createElement('div', { className: "max-w-3xl mx-auto px-4 py-8" },
                React.createElement('div', { className: "bg-white rounded-3xl border border-slate-200 p-8 shadow-sm" },
                    React.createElement('div', { className: "flex items-center justify-between mb-6" },
                        React.createElement('h1', { className: "text-3xl font-bold" }, "Cadastro de Prestador"),
                        React.createElement('button', { onClick: props.onVoltar, className: "text-sm text-slate-500 hover:text-indigo-600" }, "← Voltar")
                    ),
                    erro && React.createElement('div', { className: "mb-4 p-3 rounded-lg bg-red-50 border border-red-200" },
                        React.createElement('p', { className: "text-sm text-red-600" }, erro)
                    ),
                    React.createElement('form', { onSubmit: handleSubmit, className: "space-y-4" },
                        React.createElement('div', { className: "grid md:grid-cols-2 gap-4" },
                            React.createElement('div', null,
                                React.createElement('label', { className: "block text-sm font-medium mb-1" }, "Nome *"),
                                React.createElement('input', { type: "text", value: formData.nome, onChange: (e) => setFormData({...formData, nome: e.target.value}), className: "w-full px-4 py-2 rounded-xl border border-slate-200", required: true })
                            ),
                            React.createElement('div', null,
                                React.createElement('label', { className: "block text-sm font-medium mb-1" }, "E-mail *"),
                                React.createElement('input', { type: "email", value: formData.email, onChange: (e) => setFormData({...formData, email: e.target.value}), className: "w-full px-4 py-2 rounded-xl border border-slate-200", required: true })
                            )
                        ),
                        React.createElement('div', null,
                            React.createElement('label', { className: "block text-sm font-medium mb-1" }, "Senha *"),
                            React.createElement('input', { type: "password", value: formData.senha, onChange: (e) => setFormData({...formData, senha: e.target.value}), className: "w-full px-4 py-2 rounded-xl border border-slate-200", required: true, minLength: 6 })
                        ),
                        React.createElement('div', { className: "grid md:grid-cols-2 gap-4" },
                            React.createElement('div', null,
                                React.createElement('label', { className: "block text-sm font-medium mb-1" }, "Categoria *"),
                                React.createElement('select', { value: formData.categoria, onChange: (e) => setFormData({...formData, categoria: e.target.value}), className: "w-full px-4 py-2 rounded-xl border border-slate-200", required: true },
                                    React.createElement('option', { value: "" }, "Selecione"),
                                    CATEGORIAS.map(c => React.createElement('option', { key: c, value: c }, c))
                                )
                            ),
                            React.createElement('div', null,
                                React.createElement('label', { className: "block text-sm font-medium mb-1" }, "WhatsApp *"),
                                React.createElement('input', { type: "text", value: formData.whatsapp, onChange: (e) => setFormData({...formData, whatsapp: e.target.value}), className: "w-full px-4 py-2 rounded-xl border border-slate-200", required: true, placeholder: "(14) 99999-9999" })
                            )
                        ),
                        React.createElement('div', { className: "grid md:grid-cols-2 gap-4" },
                            React.createElement('div', null,
                                React.createElement('label', { className: "block text-sm font-medium mb-1" }, "Cidade *"),
                                React.createElement('input', { type: "text", value: formData.cidade, onChange: (e) => setFormData({...formData, cidade: e.target.value}), className: "w-full px-4 py-2 rounded-xl border border-slate-200", required: true, placeholder: "Ex: São Paulo" })
                            ),
                            React.createElement('div', null,
                                React.createElement('label', { className: "block text-sm font-medium mb-1" }, "Estado *"),
                                React.createElement('select', { value: formData.estado, onChange: (e) => setFormData({...formData, estado: e.target.value}), className: "w-full px-4 py-2 rounded-xl border border-slate-200", required: true },
                                    ESTADOS.map(uf => React.createElement('option', { key: uf, value: uf }, uf))
                                )
                            )
                        ),
                        React.createElement('button', { type: "submit", disabled: loading, className: "w-full px-6 py-4 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white font-semibold rounded-xl disabled:opacity-50" },
                            loading ? 'Cadastrando...' : 'Cadastrar'
                        )
                    )
                )
            );
        };

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
