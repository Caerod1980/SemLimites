        // ========== UTILITÁRIOS ==========

        // ========== COMPONENTES DE UI REFINADOS ==========

        function Stars(props) {
            var value = props.value || 0;
            var size = props.size || "md";
            var showNumber = props.showNumber !== false;

            var full = Math.floor(value);
            var half = value - full >= 0.5;

            var sizeClasses = {
                sm: "text-xs md:text-sm",
                md: "text-sm md:text-base",
                lg: "text-base md:text-xl",
                xl: "text-xl md:text-2xl"

            var stars = [];
            for (var i = 1; i <= 5; i++) {
                var isActive = i <= full || (i === full + 1 && half);
                var className = isActive ? "star-gold" : "text-neutral-200";

        // ========== CARD DE PRESTADOR ==========
        function CardPrestador(props) {
            var prestador = props.prestador;
            var onVerPerfil = props.onVerPerfil;

            var p = prestador;
            var [categoriaNome, setCategoriaNome] = useState('');

            useEffect(function() {
                async function buscarNomeCategoria() {
                    if (p.categoriaPrincipal && typeof p.categoriaPrincipal === 'object' && p.categoriaPrincipal.nome) {
                        setCategoriaNome(p.categoriaPrincipal.nome);
                    } 
                    else if (p.categoriaPrincipal && typeof p.categoriaPrincipal === 'string') {
                        try {
                            const response = await fetch(API_URL + '/categorias/' + p.categoriaPrincipal);
                            if (response.ok) {
                                const data = await response.json();
                                setCategoriaNome(data.nome);
                            } else {
                                setCategoriaNome(p.categoria || 'Profissional');
                            }
                        } catch (error) {
                            console.error('Erro ao buscar categoria:', error);
                            setCategoriaNome(p.categoria || 'Profissional');
                        }
                    } 
                    else if (p.categoria) {
                        setCategoriaNome(p.categoria);
                    } else {
                        setCategoriaNome('Profissional');
                    }
                }

                buscarNomeCategoria();
            }, [p.categoriaPrincipal, p.categoria]);

            var estadoDoPrestador = '';
            if (p.localizacao && p.localizacao.estado) {

            }

            if (estadoDoPrestador) {

            }

                React.createElement('div', { className: "flex flex-col h-full" },
                    React.createElement('div', { className: "flex-1 w-full" },

        // ========== TELA DE BUSCA COM LOGOTIPO CORRIGIDO ==========
        function TelaBusca(props) {
            var onVerPerfil = props.onVerPerfil;
            var [imgSrc, setImgSrc] = useState(LOGO_URLS[0]);
            var [imgIndex, setImgIndex] = useState(0);

            function handleImageError(e) {
                var nextIndex = imgIndex + 1;
                if (nextIndex < LOGO_URLS.length) {
                    setImgIndex(nextIndex);
                    setImgSrc(LOGO_URLS[nextIndex]);
                } else {
                    e.target.style.display = 'none';
                    e.target.parentElement.innerHTML = '<span class="text-2xl md:text-4xl font-bold text-white">SL</span>';
                }
            }

            var [cidade, setCidade] = useState('');
            var [categoriaBusca, setCategoriaBusca] = useState('');
            var [servicoBusca, setServicoBusca] = useState('');
            var [buscaTexto, setBuscaTexto] = useState('');
            var [resultados, setResultados] = useState([]);
            var [loading, setLoading] = useState(false);
            var [erro, setErro] = useState("");
            var [categorias, setCategorias] = useState([]);
            var [servicosDaCategoria, setServicosDaCategoria] = useState([]);

            useEffect(function() {
                fetch(API_URL + '/categorias/principais')
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        setCategorias(data);
                    })
                    .catch(function(err) {
                        console.error('Erro ao carregar categorias:', err);
                    });
            }, []);

            useEffect(function() {
                if (categoriaBusca) {
                    fetch(API_URL + '/categorias/' + categoriaBusca + '/servicos')
                        .then(function(response) { return response.json(); })
                        .then(function(data) {
                            setServicosDaCategoria(data);
                        })
                        .catch(function(err) {
                            console.error('Erro ao carregar serviços:', err);
                        });
                } else {
                    setServicosDaCategoria([]);
                }
            }, [categoriaBusca]);

            function buscar() {
                setLoading(true);
                setErro("");

                var url = API_URL + '/prestadores/busca?';
                var params = [];

                if (cidade) params.push('cidade=' + encodeURIComponent(cidade));
                if (categoriaBusca) params.push('categoriaPrincipal=' + encodeURIComponent(categoriaBusca));
                if (servicoBusca) params.push('servico=' + encodeURIComponent(servicoBusca));
                if (buscaTexto) params.push('q=' + encodeURIComponent(buscaTexto));

                params.push('limit=12');

                url = url + params.join('&');

                console.log('🔍 Buscando com URL:', url);

                fetch(url)
                    .then(function(response) {
                        if (!response.ok) {
                            throw new Error('Erro na busca: ' + response.status);
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        console.log('📥 Resultados:', data);
                        if (data.prestadores) {
                            setResultados(data.prestadores);
                        } else {
                            setResultados([]);
                        }
                        setLoading(false);
                    })
                    .catch(function(error) {
                        console.error('❌ Erro na busca:', error);
                        setErro(error.message);
                        setLoading(false);
                    });
            }

            useEffect(function() {
                var timer = setTimeout(function() {
                    buscar();
                }, 500);
                return function() { clearTimeout(timer); };
            }, [cidade, categoriaBusca, servicoBusca, buscaTexto]);

            useEffect(function() {
                buscar();
            }, []);

            return React.createElement('div', { className: "max-w-7xl mx-auto px-3 md:px-4 py-4 md:py-8" },
                React.createElement('div', {
                    className: "bg-gradient-to-r from-[#f0f7f0] to-[#fff8e7] rounded-3xl md:rounded-4xl p-4 md:p-8 mb-4 md:mb-8 border border-[#c0dfc0] shadow-sm"
                },
                    React.createElement('div', { className: "flex flex-col sm:flex-row items-center gap-4 md:gap-6 text-center sm:text-left" },
                        React.createElement('div', {
                            className: "w-16 h-16 md:w-24 md:h-24 rounded-2xl md:rounded-3xl bg-gradient-to-br from-[#3d7a3d] to-[#FFB347] p-1 shadow-lg flex-shrink-0 flex items-center justify-center"
                        },
                            React.createElement('img', {

                                alt: "SemLimites",
                                className: "w-full h-full object-contain animate-float",
                                onError: handleImageError,
                                onLoad: function(e) { 
                                    console.log('✅ Logotipo carregado com sucesso');
                                }
                            })
                        ),
                        React.createElement('div', { className: "flex-1" },
                            React.createElement('h2', { className: "font-logo text-xl md:text-3xl font-bold text-neutral-800" },
                                "Encontre o profissional ideal"
                            ),

                                "Mais de 600 serviços especializados"

                ),

                React.createElement('div', { className: "bg-white/70 backdrop-blur-sm rounded-2xl md:rounded-3xl border border-neutral-200 p-4 md:p-6 mb-4 md:mb-8 shadow-sm" },
                    React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4" },
                        React.createElement('input', {
                            type: "text",
                            value: cidade,
                            onChange: function(e) { setCidade(e.target.value); },
                            placeholder: "Cidade",
                            className: "px-3 md:px-4 py-2.5 md:py-3 rounded-xl border border-neutral-200 focus:border-[#FFB347] focus:ring-2 focus:ring-[#FFD966]/30 outline-none transition-all text-sm md:text-base"
                        }),

                        React.createElement('select', {
                            value: categoriaBusca,
                            onChange: function(e) { 
                                setCategoriaBusca(e.target.value);
                                setServicoBusca('');
                            },

                        },
                            React.createElement('option', { value: "" }, "Todas as categorias"),
                            categorias.map(function(c) {
                                return React.createElement('option', { key: c._id, value: c._id }, c.nome);
                            })
                        ),

                        React.createElement('select', {
                            value: servicoBusca,

     // ========== COMPONENTE DE CRIAÇÃO DE SERVIÇO ==========
function NovoServico(props) {
    var onSucesso = props.onSucesso;
    var onCancelar = props.onCancelar;

            var [comentario, setComentario] = useState('');
            var [emailConfirmacao, setEmailConfirmacao] = useState('');
            var [emailValido, setEmailValido] = useState(true);
            var [emailConfirmado, setEmailConfirmado] = useState(false);
            var [enviando, setEnviando] = useState(false);
            var [enviado, setEnviado] = useState(false);
            var [hoverEstrela, setHoverEstrela] = useState(0);

            var pathParts = window.location.pathname.split('/');
            var token = pathParts[pathParts.length - 1];

            useEffect(function() {
                if (!token) {
                    setErro('Token não encontrado');
                    setLoading(false);
                    return;
                }

                console.log('🔍 Buscando serviço com token:', token);
                
                fetch(API_URL + '/servicos/avaliar/' + token)
                    .then(function(response) {
                        console.log('📥 Resposta status:', response.status);
                        if (!response.ok) {
                            if (response.status === 404) {
                                throw new Error('Link de avaliação não encontrado ou expirado');
                            }
                            throw new Error('Erro ao carregar serviço');
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        console.log('✅ Dados recebidos:', data);
                        if (data.servico) {
                            setServico(data.servico);
                        } else {
                            setErro(data.error || 'Link inválido ou expirado');
                        }
                        setLoading(false);
                    })
                    .catch(function(error) {
                        console.error('❌ Erro detalhado:', error);
                        setErro(error.message);
                        setLoading(false);
                    });
            }, [token]);

            function validarEmail(email) {
                if (!email) return false;
                var regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return regex.test(email);
            }

            function handleVerificarEmail() {
                if (!servico) {
                    setErro('Serviço não encontrado. Tente novamente mais tarde.');
                    return;
                }

                if (!emailConfirmacao) {
                    setEmailValido(false);
                    setErro('Por favor, digite seu e-mail');
                    return;
                }
                
                if (!validarEmail(emailConfirmacao)) {
                    setEmailValido(false);
                    setErro('E-mail inválido. Digite um e-mail válido');
                    return;
                }

                if (!servico.clienteEmail) {
                    setErro('Este serviço não possui e-mail cadastrado para validação');
                    return;
                }

                if (emailConfirmacao.toLowerCase().trim() === servico.clienteEmail.toLowerCase().trim()) {
                    setEmailConfirmado(true);
                    setErro('');
                    setEmailValido(true);
                } else {
                    setErro('E-mail não corresponde ao cadastrado para este serviço');
                    setEmailValido(false);

                e.preventDefault();

                setEnviando(true);

                fetch(API_URL + '/servicos/avaliar/' + token, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        estrelas: estrelas, 
                        comentario: comentario,
                        email: emailConfirmacao

                if (numeros.length !== 11) return false;
                
                if (/^(\d)\1+$/.test(numeros)) return false;
                
                var soma = 0;
                for (var i = 0; i < 9; i++) {
                    soma += parseInt(numeros.charAt(i)) * (10 - i);
                }
                var resto = (soma * 10) % 11;
                if (resto === 10 || resto === 11) resto = 0;
                if (resto !== parseInt(numeros.charAt(9))) return false;
                
                soma = 0;
                for (var i = 0; i < 10; i++) {
                    soma += parseInt(numeros.charAt(i)) * (11 - i);
                }
                resto = (soma * 10) % 11;
                if (resto === 10 || resto === 11) resto = 0;
                if (resto !== parseInt(numeros.charAt(10))) return false;
                
                return true;
            }

        // ========== TELA DE PERFIL PÚBLICO COM BOTÃO WHATSAPP CORRIGIDO ==========
        function TelaPerfil(props) {
            var prestador = props.prestador;
            var prestadorId = props.prestadorId;
            var onVoltar = props.onVoltar;
            
            var [loading, setLoading] = useState(false);
            var [dadosCompletos, setDadosCompletos] = useState(null);
            var [servicosDetalhados, setServicosDetalhados] = useState([]);
            var [categoriaPrincipalDetalhada, setCategoriaPrincipalDetalhada] = useState(null);
            var [erro, setErro] = useState('');
            var [compartilhado, setCompartilhado] = useState(false);
            
            var [curtido, setCurtido] = useState(false);
            var [totalCurtidas, setTotalCurtidas] = useState(0);
            var [carregandoCurtida, setCarregandoCurtida] = useState(false);

            useEffect(function() {
                var idParaBuscar = prestador?._id || prestadorId;
                
                if (idParaBuscar) {
                    carregarDadosCompletos(idParaBuscar);
                } else {
                    setErro('Prestador não encontrado');
                }
            }, [prestador, prestadorId]);

            useEffect(function() {
                if (dadosCompletos && dadosCompletos._id) {
                    fetch(API_URL + '/favoritos/prestador/' + dadosCompletos._id + '/total')
                        .then(function(response) { return response.json(); })
                        .then(function(data) {
                            setTotalCurtidas(data.totalCurtidas || 0);
                        })
                        .catch(function(error) {
                            console.error('Erro ao buscar total de curtidas:', error);
                        });

                    var token = localStorage.getItem('token');
                    var user = localStorage.getItem('user');
                    
                    if (token && user) {
                        var userData = JSON.parse(user);
                        if (userData.tipo === 'cliente') {
                            fetch(API_URL + '/favoritos/' + dadosCompletos._id + '/check', {
                                headers: { 'Authorization': 'Bearer ' + token }
                            })
                                .then(function(response) { return response.json(); })
                                .then(function(data) {
                                    setCurtido(data.curtido);
                                })
                                .catch(function(error) {
                                    console.error('Erro ao verificar curtida:', error);
                                });
                        }
                    }
                }
            }, [dadosCompletos]);

            function carregarDadosCompletos(id) {
                setLoading(true);
                setErro('');
                
                fetch(API_URL + '/prestadores/id/' + id)
                    .then(function(response) { 
                        if (!response.ok) {
                            throw new Error('Erro ao carregar perfil');
                        }
                        return response.json(); 
                    })
                    .then(function(data) {
                        console.log('📥 Dados completos do prestador:', data);
                        setDadosCompletos(data);
                        
                        if (data.categoriaPrincipal && typeof data.categoriaPrincipal === 'string') {
                            fetch(API_URL + '/categorias/' + data.categoriaPrincipal)
                                .then(function(res) { return res.json(); })
                                .then(function(cat) {
                                    setCategoriaPrincipalDetalhada(cat);
                                })
                                .catch(function(err) {
                                    console.error('Erro ao buscar categoria:', err);
                                });
                        } else if (data.categoriaPrincipal && data.categoriaPrincipal.nome) {
                            setCategoriaPrincipalDetalhada(data.categoriaPrincipal);
                        }
                        
                        if (data.servicos && data.servicos.length > 0) {
                            var servicosParaBuscar = data.servicos.map(function(s) {
                                return typeof s === 'string' ? s : s._id || s;
                            });
                            
                            Promise.all(
                                servicosParaBuscar.map(function(servicoId) {
                                    return fetch(API_URL + '/categorias/' + servicoId)
                                        .then(function(res) { return res.json(); })
                                        .catch(function() { 
                                            return { _id: servicoId, nome: 'Serviço não encontrado' }; 
                                        });
                                })
                            ).then(function(resultados) {
                                console.log('📥 Serviços detalhados:', resultados);
                                setServicosDetalhados(resultados);
                                setLoading(false);
                            }).catch(function(err) {
                                console.error('Erro ao buscar serviços:', err);
                                setLoading(false);
                            });
                        } else {
                            setLoading(false);
                        }
                    })
                    .catch(function(error) {
                        console.error('❌ Erro ao carregar perfil:', error);
                        setErro('Erro ao carregar perfil. Tente novamente.');
                        setLoading(false);
                    });
            }

            function handleCurtir() {
                var token = localStorage.getItem('token');
                
                if (!token) {
                    sessionStorage.setItem('curtirAposLogin', dadosCompletos._id);
                    navigate('/login');
                    return;
                }

                var user = localStorage.getItem('user');
                if (user) {
                    var userData = JSON.parse(user);
                    if (userData.tipo !== 'cliente') {
                        alert('Apenas clientes podem curtir prestadores');
                        return;
                    }
                }

                setCarregandoCurtida(true);

                var method = curtido ? 'DELETE' : 'POST';
                var url = API_URL + '/favoritos/' + dadosCompletos._id;

                fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                })
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        if (data.success || data.curtido !== undefined) {
                            setCurtido(!curtido);
                            setTotalCurtidas(prev => curtido ? prev - 1 : prev + 1);
                        } else if (data.error) {
                            alert(data.error);
                        }
                    })
                    .catch(function(error) {
                        console.error('Erro ao curtir:', error);
                        alert('Erro ao processar curtida');
                    })
                    .finally(function() {
                        setCarregandoCurtida(false);
                    });
            }

            function handleCompartilhar() {
                var p = dadosCompletos || prestador;
                if (!p) return;
                
                var catNome = categoriaPrincipalDetalhada?.nome || p.categoriaPrincipal?.nome || p.categoria || 'Categoria não informada';
                
                var perfilUrl = SITE_URL + BASE_PATH + "/perfil/" + p._id;
                
                var servicosTexto = '';
                if (servicosDetalhados.length > 0) {
                    var nomesServicos = servicosDetalhados.map(function(s) {

                                        React.createElement('span', { className: "text-slate-700 text-sm md:text-base font-medium" }, p.telefone)
                                    )
                                )
                            )
                        ),

                        p.avaliacoes > 0 && React.createElement('div', { className: "mt-8 pt-6 border-t border-[#c0dfc0]" },
                            React.createElement('h2', { className: "text-base md:text-xl font-semibold mb-4 flex items-center gap-2 text-[#3d7a3d]" },
                                React.createElement('svg', { className: "w-5 h-5 md:w-6 md:h-6 text-[#FFB347]", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" },
                                    React.createElement('path', {
                                        strokeLinecap: "round",
                                        strokeLinejoin: "round",
                                        strokeWidth: 2,
                                        d: "M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
                                    })
                                ),
                                "Serviços Realizados"
                            ),
                            React.createElement(ServicosPrestador, { prestadorId: p._id })
                        )
                    )
                )
            );
        }

        // ========== FUNÇÃO DE NAVEGAÇÃO ==========
        function navigate(path) {
            var fullPath = BASE_PATH + path;
            window.history.pushState({}, '', fullPath);
            
            if (path.startsWith('/avaliar/')) {
                window.appSetModo('avaliar');
            } else if (path === '/login') {
                window.appSetModo('login');
            } else if (path === '/cadastro') {
                window.appSetModo('cadastro');
            } else if (path === '/dashboard') {
                window.appSetModo('dashboard');
            } else if (path === '/dashboard-cliente') {
                window.appSetModo('dashboard-cliente');
            } else if (path.startsWith('/perfil/')) {
                window.appSetModo('perfil');
            } else if (path === '/esqueci-senha') {
                window.appSetModo('esqueci-senha');
            } else if (path.startsWith('/resetar-senha/')) {
                window.appSetModo('resetar-senha');
            } else {
                window.appSetModo('busca');
            }
        }

        // ========== APP PRINCIPAL ==========
        function App() {
            var [modo, setModo] = useState('busca');
            var [usuario, setUsuario] = useState(null);
            var [prestadorSelecionado, setPrestadorSelecionado] = useState(null);
            var [prestadorId, setPrestadorId] = useState(null);

            window.appSetModo = setModo;

            useEffect(function() {
                var path = window.location.pathname.replace(BASE_PATH, '') || '/';
                console.log('📍 Path atual:', path);
                
                if (path.startsWith('/avaliar/')) {
                    setModo('avaliar');
                } else if (path === '/login') {
                    setModo('login');
                } else if (path === '/cadastro') {
                    setModo('cadastro');
                } else if (path === '/dashboard') {
                    setModo('dashboard');
                } else if (path === '/dashboard-cliente') {
                    setModo('dashboard-cliente');
                } else if (path.startsWith('/perfil/')) {
                    var id = path.split('/')[2];
                    console.log('📌 ID do perfil da URL:', id);
                    if (id) {
                        setPrestadorId(id);
                        setPrestadorSelecionado(null);
                        setModo('perfil');
                    } else {
                        setModo('busca');
                    }
                } else if (path === '/esqueci-senha') {
                    setModo('esqueci-senha');
                } else if (path.startsWith('/resetar-senha/')) {
                    setModo('resetar-senha');
                } else {
                    setModo('busca');
                }
                
                var token = localStorage.getItem('token');
                if (token) {
                    fetch(API_URL + '/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    })
                        .then(function(response) { return response.json(); })
                        .then(function(data) {
                            if (!data.error) {
                                setUsuario(data);
                                localStorage.setItem('user', JSON.stringify(data));
                            }
                        })
                        .catch(function(error) { console.error(error); });
                }
            }, []);

            function voltarParaBusca() {
                navigate('/');
                setPrestadorId(null);
                setPrestadorSelecionado(null);
            }

            function handleVerPerfil(prestador) {
                console.log('👤 App recebeu prestador para ver perfil:', prestador.nome);
                setPrestadorSelecionado(prestador);
                setPrestadorId(null);
                navigate('/perfil/' + prestador._id);
            }

            function handleLoginSuccess(userData, prestadorParaCurtir) {
                setUsuario(userData);
                
                if (prestadorParaCurtir) {
                    navigate('/perfil/' + prestadorParaCurtir);
                } else if (userData.tipo === 'cliente') {
                    navigate('/dashboard-cliente');
                } else {
                    navigate('/dashboard');
                }
            }

            function handleCadastroSucesso() {
                navigate('/');
            }

            function handleSair() {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                setUsuario(null);
                navigate('/');
            }

            var header = modo !== 'avaliar' ? React.createElement(Header, {
                usuario: usuario,
                onVoltar: voltarParaBusca,
                onNavigate: navigate
            }) : null;

            var content = null;
            if (modo === 'busca') {
                content = React.createElement(TelaBusca, { onVerPerfil: handleVerPerfil });
            } else if (modo === 'perfil') {
                content = React.createElement(TelaPerfil, { 
                    prestador: prestadorSelecionado, 
                    prestadorId: prestadorId,
                    onVoltar: voltarParaBusca 
                });
            } else if (modo === 'login') {
                content = React.createElement(Login, { onLoginSuccess: handleLoginSuccess, onVoltar: voltarParaBusca });
            } else if (modo === 'cadastro') {
                content = React.createElement(CadastroPrestador, { onCadastroSucesso: handleCadastroSucesso, onVoltar: voltarParaBusca });
            } else if (modo === 'dashboard') {
                content = React.createElement(DashboardPrestador, { usuario: usuario, onSair: handleSair });
            } else if (modo === 'dashboard-cliente') {
                content = React.createElement(DashboardCliente, { 
                    usuario: usuario, 
                    onSair: handleSair,
                    onVerPerfil: handleVerPerfil 
                });
            } else if (modo === 'avaliar') {
                content = React.createElement(AvaliarServico);
            } else if (modo === 'esqueci-senha') {
                content = React.createElement(EsqueciSenha, { 
                    onVoltar: voltarParaBusca 
                });
            } else if (modo === 'resetar-senha') {
                content = React.createElement(ResetarSenha, { 
                    onVoltar: voltarParaBusca,
                    onSucesso: function() { navigate('/login'); }
                });
            }

            return React.createElement('div', { className: "min-h-screen bg-gradient-to-b from-[#fcf8f3] to-white overflow-guard" },
                header,
                React.createElement('main', null, content)
            );
        }

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
