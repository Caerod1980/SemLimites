    <script>

        // ========== UTILITÁRIOS ==========
        function cls() {
            var args = Array.prototype.slice.call(arguments);
            var result = [];
            for (var i = 0; i < args.length; i++) {
                if (args[i]) {
                    result.push(args[i]);
                }

            return result.join(" ");

        // Função segura para fetch com tratamento de erro melhorado
        function safeFetch(url, options) {
            return fetch(url, options)
                .then(function(response) {
                    // Verifica se a resposta é OK
                    if (!response.ok) {
                        return response.text().then(function(text) {
                            // Tenta ver se é HTML
                            if (text.trim().startsWith('<')) {
                                throw new Error('Erro de conexão com o servidor');
                            }
                            try {
                                var json = JSON.parse(text);
                                throw new Error(json.error || 'Erro na requisição');
                            } catch (e) {
                                throw new Error('Erro na requisição: ' + response.status);
                            }
                        });
                    }
                    return response.json();
                });
        }

        // ========== COMPONENTES DE UI ==========

            for (var i = 1; i <= 5; i++) {
                var isActive = i <= full || (i === full + 1 && half);
                var className = isActive ? "star-gold" : "text-neutral-200";

                stars.push(React.createElement('span', {
                    key: i,

        // ========== CARD DE PRESTADOR ==========

            var p = prestador;

            var estadoDoPrestador = '';
            if (p.localizacao && p.localizacao.estado) {
                estadoDoPrestador = p.localizacao.estado;
            }

            var localizacao = p.cidade || '';
            if (estadoDoPrestador) {
                localizacao = localizacao + (localizacao ? ' - ' : '') + estadoDoPrestador;
            }
            if (!localizacao) localizacao = 'Localização não informada';

            return React.createElement('div', {
                className: "bg-white/90 backdrop-blur-sm rounded-2xl md:rounded-3xl border border-neutral-200 p-4 md:p-6 hover:shadow-xl transition-all duration-300 hover:border-[#FFD966]/50 group"
            },
                React.createElement('div', { className: "flex flex-col xs:flex-row items-start gap-3 md:gap-4" },
                    React.createElement(Avatar, { name: p.nome, size: "lg" }),
                    React.createElement('div', { className: "flex-1 w-full xs:w-auto" },

                        React.createElement('p', { className: "text-xs md:text-sm text-neutral-500 mt-0.5 break-words" },

                        React.createElement('button', {
                            onClick: function() { onVerPerfil(p); },

                        }, "Ver perfil →")
                    )
                )
            );
        }

        // ========== TELA DE BUSCA ==========
        function TelaBusca(props) {
            var onVerPerfil = props.onVerPerfil;
            
            var [estado, setEstado] = useState('');
            var [cidade, setCidade] = useState('');
            var [categoria, setCategoria] = useState('');
            var [buscaTexto, setBuscaTexto] = useState('');
            var [resultados, setResultados] = useState([]);
            var [loading, setLoading] = useState(false);
            var [erro, setErro] = useState("");

            var logotipoBannerUrl = 'https://github.com/Caerod1980/Imagens-Sem-Limites/blob/1e9c9ecb02affcaf8cd684466da02d235671a1cb/logo%20oficial%20transparente.png?raw=true';

            function buscar() {
                setLoading(true);
                setErro("");
                
                var url = API_URL + '/prestadores/busca?';
                var params = [];
                
                if (cidade) params.push('cidade=' + encodeURIComponent(cidade));
                if (categoria) params.push('categoria=' + encodeURIComponent(categoria));
                if (buscaTexto) params.push('q=' + encodeURIComponent(buscaTexto));
                
                params.push('limit=12');
                
                url = url + params.join('&');
                
                console.log('🔍 Buscando com URL:', url);
                
                safeFetch(url)
                    .then(function(data) {
                        console.log('📥 Resultados:', data);
                        
                        if (data.prestadores) {
                            setResultados(data.prestadores);
                        } else {
                            setResultados([]);
                        }
                        setLoading(false);
                    })
                    .catch(function(error) {
                        console.error('❌ Erro na busca:', error);
                        setErro('Erro ao conectar com o servidor. Tente novamente.');
                        setLoading(false);
                        setResultados([]);
                    });
            }

            useEffect(function() {
                var timer = setTimeout(function() {
                    buscar();
                }, 500);
                return function() { clearTimeout(timer); };
            }, [cidade, categoria, buscaTexto]);

            useEffect(function() {
                buscar();
            }, []);

            var estadoOptions = [
                React.createElement('option', { key: "empty", value: "" }, "Todos os estados")
            ];
            for (var i = 0; i < ESTADOS.length; i++) {
                estadoOptions.push(
                    React.createElement('option', { key: ESTADOS[i], value: ESTADOS[i] }, ESTADOS[i])
                );
            }

            var categoriaOptions = [
                React.createElement('option', { key: "empty", value: "" }, "Todas as categorias")
            ];
            for (var j = 0; j < CATEGORIAS.length; j++) {
                categoriaOptions.push(
                    React.createElement('option', { key: CATEGORIAS[j], value: CATEGORIAS[j] }, CATEGORIAS[j])
                );
            }

            return React.createElement('div', { className: "max-w-7xl mx-auto px-3 md:px-4 py-4 md:py-8" },
                React.createElement('div', {
                    className: "bg-gradient-to-r from-[#f0f7f0] to-[#fff8e7] rounded-3xl md:rounded-4xl p-4 md:p-8 mb-4 md:mb-8 border border-[#c0dfc0] shadow-sm"
                },
                    React.createElement('div', { className: "flex flex-col sm:flex-row items-center gap-4 md:gap-6 text-center sm:text-left" },
                        React.createElement('div', {
                            className: "w-16 h-16 md:w-24 md:h-24 rounded-2xl md:rounded-3xl bg-gradient-to-br from-[#3d7a3d] to-[#FFB347] p-1 shadow-lg flex-shrink-0"
                        },
                            React.createElement('img', {
                                src: logotipoBannerUrl,
                                alt: "SemLimites",
                                className: "w-full h-full object-contain animate-float",
                                onError: function(e) { e.target.style.display = 'none'; }
                            })
                        ),
                        React.createElement('div', { className: "flex-1" },
                            React.createElement('h2', { className: "font-logo text-xl md:text-3xl font-bold text-neutral-800" },
                                "Encontre o profissional ideal"
                            ),
                            React.createElement('p', { className: "text-sm md:text-base text-neutral-600 mt-1 flex items-center gap-2 flex-wrap justify-center sm:justify-start" },
                                React.createElement(Stars, { value: 4.9, size: "sm" }),
                                "com base na opinião de quem já contratou"
                            )
                        )
                    )
                ),

                React.createElement('div', { className: "bg-white/70 backdrop-blur-sm rounded-2xl md:rounded-3xl border border-neutral-200 p-4 md:p-6 mb-4 md:mb-8 shadow-sm" },
                    React.createElement('div', { className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4" },
                        React.createElement('select', {
                            value: estado,
                            onChange: function(e) {
                                setEstado(e.target.value);
                                if (e.target.value) {
                                    alert('💡 Dica: Use o campo "Cidade" para filtrar por localização.');
                                }
                            },
                            className: "px-3 md:px-4 py-2.5 md:py-3 rounded-xl border border-neutral-200 focus:border-[#FFB347] focus:ring-2 focus:ring-[#FFD966]/30 outline-none transition-all bg-white text-sm md:text-base"
                        }, estadoOptions),

                        React.createElement('input', {
                            type: "text",
                            value: cidade,
                            onChange: function(e) { setCidade(e.target.value); },
                            placeholder: "🌆 Cidade",
                            className: "px-3 md:px-4 py-2.5 md:py-3 rounded-xl border border-neutral-200 focus:border-[#FFB347] focus:ring-2 focus:ring-[#FFD966]/30 outline-none transition-all text-sm md:text-base"
                        }),

                        React.createElement('select', {
                            value: categoria,
                            onChange: function(e) { setCategoria(e.target.value); },
                            className: "px-3 md:px-4 py-2.5 md:py-3 rounded-xl border border-neutral-200 focus:border-[#FFB347] focus:ring-2 focus:ring-[#FFD966]/30 outline-none transition-all bg-white text-sm md:text-base"
                        }, categoriaOptions),

                        React.createElement('input', {
                            type: "text",
                            value: buscaTexto,
                            onChange: function(e) { setBuscaTexto(e.target.value); },
                            placeholder: "🔍 Buscar...",
                            className: "px-3 md:px-4 py-2.5 md:py-3 rounded-xl border border-neutral-200 focus:border-[#FFB347] focus:ring-2 focus:ring-[#FFD966]/30 outline-none transition-all text-sm md:text-base"
                        })
                    )
                ),

                loading && React.createElement('div', { className: "text-center py-8 md:py-12" },

                        className: "w-10 h-10 md:w-12 md:h-12 border-4 border-[#FFD966] border-t-[#FFB347] rounded-full animate-spin mx-auto mb-3 md:mb-4"
                    }),
                    React.createElement('p', { className: "text-sm md:text-base text-neutral-600" }, "Buscando profissionais...")
                ),

                erro && React.createElement('div', { className: "text-center py-8 md:py-12" },
                    React.createElement('p', { className: "text-sm md:text-base text-[#F09030]" }, erro)

                !loading && !erro && React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6" },

        // ========== COMPONENTES DE AUTENTICAÇÃO ==========
        function Login(props) {
            var onLoginSuccess = props.onLoginSuccess;
            var onVoltar = props.onVoltar;
            
            var [email, setEmail] = useState('');
            var [senha, setSenha] = useState('');
            var [tipo, setTipo] = useState('cliente');
            var [modo, setModo] = useState('login');
            var [loading, setLoading] = useState(false);
            var [erro, setErro] = useState('');

            function handleSubmit(e) {
                e.preventDefault();
                setLoading(true);
                setErro('');

                var url = API_URL;
                var body = {};

                if (modo === 'login') {
                    url = url + '/auth/login';
                    body = { email: email, senha: senha, tipo: tipo };
                } else {
                    url = url + '/auth/register';
                    body = { email: email, senha: senha, tipo: tipo, nome: email.split('@')[0] };
                }

                safeFetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                })
                    .then(function(data) {
                        if (modo === 'login') {
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('user', JSON.stringify(data.user));
                            onLoginSuccess(data.user);
                        } else {
                            alert('Cadastro realizado! Faça login.');
                            setModo('login');
                        }
                        setLoading(false);
                    })
                    .catch(function(error) {
                        setErro(error.message);
                        setLoading(false);
                    });
            }

            var radioButtons = [];
            var tipos = ['cliente', 'prestador'];
            for (var i = 0; i < tipos.length; i++) {
                var t = tipos[i];
                var radio = React.createElement('label', { key: t, className: "flex items-center gap-2" },
                    React.createElement('input', {
                        type: "radio",
                        value: t,
                        checked: tipo === t,
                        onChange: function() { setTipo(t); },
                        className: "w-4 h-4 text-indigo-600"
                    }),
                    React.createElement('span', { className: "text-xs md:text-sm" }, 
                        t === 'cliente' ? 'Cliente' : 'Prestador'
                    )
                );
                radioButtons.push(radio);
            }

            return React.createElement('div', { className: "max-w-md mx-auto px-4 py-8 md:py-12" },
                React.createElement('div', { className: "bg-white rounded-2xl md:rounded-3xl border border-slate-200 p-6 md:p-8 shadow-sm" },
                    React.createElement('div', { className: "flex items-center justify-between mb-6" },
                        React.createElement('h1', { className: "text-xl md:text-2xl font-bold" }, 
                            modo === 'login' ? 'Entrar' : 'Criar conta'
                        ),
                        React.createElement('button', { 
                            onClick: onVoltar, 
                            className: "text-xs md:text-sm text-slate-500 hover:text-indigo-600" 
                        }, "← Voltar")
                    ),

                    erro && React.createElement('div', { className: "mb-4 p-3 rounded-lg bg-red-50 border border-red-200" },
                        React.createElement('p', { className: "text-sm text-red-600" }, erro)
                    ),

                    React.createElement('form', { onSubmit: handleSubmit, className: "space-y-4" },
                        React.createElement('div', null,
                            React.createElement('label', { className: "block text-xs md:text-sm font-medium mb-1" }, "Tipo de conta"),
                            React.createElement('div', { className: "flex gap-4" }, radioButtons)
                        ),

                        React.createElement('div', null,
                            React.createElement('label', { className: "block text-xs md:text-sm font-medium mb-1" }, "E-mail"),
                            React.createElement('input', {
                                type: "email",
                                value: email,
                                onChange: function(e) { setEmail(e.target.value); },
                                className: "w-full px-3 md:px-4 py-2.5 md:py-3 rounded-xl border border-slate-200 text-sm",
                                required: true
                            })
                        ),

                        React.createElement('div', null,
                            React.createElement('label', { className: "block text-xs md:text-sm font-medium mb-1" }, "Senha"),
                            React.createElement('input', {
                                type: "password",
                                value: senha,
                                onChange: function(e) { setSenha(e.target.value); },
                                className: "w-full px-3 md:px-4 py-2.5 md:py-3 rounded-xl border border-slate-200 text-sm",
                                required: true,
                                minLength: 6
                            })
                        ),

                        React.createElement('button', {
                            type: "submit",
                            disabled: loading,
                            className: "w-full px-4 md:px-6 py-2.5 md:py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-700 text-white font-semibold disabled:opacity-50 text-sm md:text-base"
                        }, loading ? 'Processando...' : (modo === 'login' ? 'Entrar' : 'Cadastrar')),

                        React.createElement('div', { className: "text-center mt-4" },
                            React.createElement('button', {
                                type: "button",
                                onClick: function() { setModo(modo === 'login' ? 'registro' : 'login'); },
                                className: "text-xs md:text-sm text-indigo-600 hover:text-indigo-800"
                            }, modo === 'login' ? 'Não tem conta? Cadastre-se' : 'Já tem conta? Faça login')
                        )
                    )
                )
            );
        }

        // ========== COMPONENTES SIMPLIFICADOS (DEMAIS TELAS) ==========
        // Para manter o código funcional e evitar erros, crio versões básicas
        function NovoServico(props) { return React.createElement('div', { className: "p-4" }, 'Novo Serviço'); }
        function MeusServicos() { return React.createElement('div', { className: "p-4" }, 'Meus Serviços'); }
        function MinhasAvaliacoes() { return React.createElement('div', { className: "p-4" }, 'Minhas Avaliações'); }
        function EditarPerfil(props) { return React.createElement('div', { className: "p-4" }, 'Editar Perfil'); }
        function ServicosPrestador(props) { return React.createElement('div', { className: "p-4" }, 'Serviços'); }
        function AvaliarServico() { return React.createElement('div', { className: "p-4" }, 'Avaliar Serviço'); }
        function CadastroPrestador(props) { return React.createElement('div', { className: "p-4" }, 'Cadastro'); }
        function DashboardPrestador(props) { return React.createElement('div', { className: "p-4" }, 'Dashboard'); }
        function TelaPerfil(props) { return React.createElement('div', { className: "p-4" }, 'Perfil'); }

        // ========== FUNÇÃO DE NAVEGAÇÃO ==========
        function navigate(path) {
            var fullPath = BASE_PATH + path;
            window.history.pushState({}, '', fullPath);
            
            if (path.startsWith('/avaliar/')) {
                window.appSetModo('avaliar');
            } else if (path === '/login') {
                window.appSetModo('login');
            } else if (path === '/cadastro') {
                window.appSetModo('cadastro');
            } else if (path === '/dashboard') {
                window.appSetModo('dashboard');
            } else if (path === '/perfil') {
                window.appSetModo('perfil');
            } else {
                window.appSetModo('busca');
            }
        }

        // ========== APP PRINCIPAL ==========
        function App() {
            var [modo, setModo] = useState('busca');
            var [usuario, setUsuario] = useState(null);
            var [prestadorSelecionado, setPrestadorSelecionado] = useState(null);

            window.appSetModo = setModo;

            useEffect(function() {
                var path = window.location.pathname.replace(BASE_PATH, '') || '/';
                
                if (path.startsWith('/avaliar/')) {
                    setModo('avaliar');
                } else if (path === '/login') {
                    setModo('login');
                } else if (path === '/cadastro') {
                    setModo('cadastro');
                } else if (path === '/dashboard') {
                    setModo('dashboard');
                } else if (path === '/perfil') {
                    setModo('perfil');
                } else {
                    setModo('busca');
                }
                
                var token = localStorage.getItem('token');
                if (token) {
                    safeFetch(API_URL + '/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    })
                        .then(function(data) {
                            if (!data.error) setUsuario(data);
                        })
                        .catch(function(error) { console.error(error); });
                }
            }, []);

            function voltarParaBusca() {
                navigate('/');
            }

            function handleVerPerfil(prestador) {
                setPrestadorSelecionado(prestador); 
                navigate('/perfil'); 
            }

            function handleLoginSuccess() {
                navigate('/dashboard');
            }

            function handleCadastroSucesso() {
                navigate('/');
            }

            function handleSair() {
                localStorage.removeItem('token'); 
                setUsuario(null); 
                navigate('/');
            }

            var header = modo !== 'avaliar' ? React.createElement(Header, {
                usuario: usuario,
                onVoltar: voltarParaBusca,
                onNavigate: navigate
            }) : null;

            var content = null;
            if (modo === 'busca') {
                content = React.createElement(TelaBusca, { onVerPerfil: handleVerPerfil });
            } else if (modo === 'perfil') {
                content = React.createElement(TelaPerfil, { prestador: prestadorSelecionado, onVoltar: voltarParaBusca });
            } else if (modo === 'login') {
                content = React.createElement(Login, { onLoginSuccess: handleLoginSuccess, onVoltar: voltarParaBusca });
            } else if (modo === 'cadastro') {
                content = React.createElement(CadastroPrestador, { onCadastroSucesso: handleCadastroSucesso, onVoltar: voltarParaBusca });
            } else if (modo === 'dashboard') {
                content = React.createElement(DashboardPrestador, { usuario: usuario, onSair: handleSair });
            } else if (modo === 'avaliar') {
                content = React.createElement(AvaliarServico);
            }

            return React.createElement('div', { className: "min-h-screen bg-gradient-to-b from-[#fcf8f3] to-white overflow-guard" },
                header,
                React.createElement('main', null, content)
            );
        }

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
