        // ========== COMPONENTE DE AVATAR CORRIGIDO COM TOKEN SAS ==========
        function Avatar(props) {
            var size = props.size || "md";
            var src = props.src || null;
            var [imgSrc, setImgSrc] = useState(null);
            var [loading, setLoading] = useState(false);
            var [erro, setErro] = useState(false);

            var sizeClasses = {
                sm: "w-8 h-8",
                md: "w-10 h-10",
                lg: "w-12 h-12",
                xl: "w-14 h-14 md:w-16 md:h-16",
                xxl: "w-20 h-20 md:w-24 md:h-24"
            };

            // Função para obter token SAS de leitura
            function obterTokenLeitura(blobUrl) {
                if (!blobUrl) return;
                
                setLoading(true);
                setErro(false);
                
                console.log('🔄 Solicitando token SAS para:', blobUrl);
                
                fetch(API_URL + '/upload/sas-token-leitura', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ blobUrl: blobUrl })
                })
                .then(function(res) { 
                    if (!res.ok) {
                        throw new Error('Erro ao obter token: ' + res.status);
                    }
                    return res.json(); 
                })
                .then(function(data) {
                    if (data.sasUrl) {
                        console.log('✅ Token SAS obtido com sucesso');
                        setImgSrc(data.sasUrl);
                    } else {
                        throw new Error('Token não retornado pela API');
                    }
                    setLoading(false);
                })
                .catch(function(err) {
                    console.error('❌ Erro ao obter token de leitura:', err);
                    setErro(true);
                    setLoading(false);
                });
            }

            // Efeito para processar a URL quando ela mudar
            useEffect(function() {
                setImgSrc(null);
                setLoading(false);
                setErro(false);

                if (!src) return;

                if (src.includes('blob.core.windows.net')) {
                    obterTokenLeitura(src);
                } else {
                    setImgSrc(src);
                }
            }, [src]);

            if (loading) {
                return React.createElement('div', {
                    className: cls(
                        "rounded-2xl bg-gradient-to-br from-indigo-100 to-indigo-200 animate-pulse border-2 border-white shadow-md",
                        sizeClasses[size]
                    )
                });
            }

            if (erro || !imgSrc) {
                return React.createElement('div', {
                    className: cls(
                        "rounded-2xl avatar-placeholder border-2 border-white shadow-md",
                        sizeClasses[size]
                    )
                });
            }

            return React.createElement('img', {
                src: imgSrc,
                className: cls("rounded-2xl object-cover border-2 border-white shadow-md", sizeClasses[size]),
                onError: function() {
                    console.log('❌ Erro ao carregar imagem mesmo com token:', imgSrc);
                    setErro(true);
                    setImgSrc(null);
                }
            });
        }

                            )

        // ========== CARD COMPLETO DE PRESTADOR ==========
        function CardPrestador(props) {
            var prestador = props.prestador;
            var onVerPerfil = props.onVerPerfil;

            var p = prestador;
            var [categoriaNome, setCategoriaNome] = useState('');

            useEffect(function() {
                async function buscarNomeCategoria() {
                    if (p.categoriaPrincipal && typeof p.categoriaPrincipal === 'object' && p.categoriaPrincipal.nome) {
                        setCategoriaNome(p.categoriaPrincipal.nome);
                    } 
                    else if (p.categoriaPrincipal && typeof p.categoriaPrincipal === 'string') {
                        try {
                            const response = await fetch(API_URL + '/categorias/' + p.categoriaPrincipal);
                            if (response.ok) {
                                const data = await response.json();
                                setCategoriaNome(data.nome);
                            } else {
                                setCategoriaNome(p.categoria || 'Profissional');
                            }
                        } catch (error) {
                            console.error('Erro ao buscar categoria:', error);
                            setCategoriaNome(p.categoria || 'Profissional');
                        }
                    } 
                    else if (p.categoria) {
                        setCategoriaNome(p.categoria);
                    } else {
                        setCategoriaNome('Profissional');
                    }
                }

                buscarNomeCategoria();
            }, [p.categoriaPrincipal, p.categoria]);

            var estadoDoPrestador = '';
            if (p.localizacao && p.localizacao.estado) {
                estadoDoPrestador = p.localizacao.estado;
            }

            var localizacao = p.cidade || '';
            if (estadoDoPrestador) {
                localizacao = localizacao + (localizacao ? ' - ' : '') + estadoDoPrestador;
            }
            if (!localizacao) localizacao = 'Localização não informada';

            return React.createElement('div', {
                className: "bg-white/90 backdrop-blur-sm rounded-2xl md:rounded-3xl border border-neutral-200 p-4 md:p-6 hover:shadow-xl transition-all duration-300 hover:border-[#FFD966]/50 group h-full flex flex-col"
            },
                React.createElement('div', { className: "flex flex-col h-full" },
                    React.createElement('div', { className: "flex-1 w-full" },
                        React.createElement('h3', { className: "font-logo text-base md:text-lg font-semibold text-neutral-800 group-hover:text-[#3d7a3d] transition-colors break-words" },
                            p.nome
                        ),
                        React.createElement('p', { className: "text-xs md:text-sm text-neutral-500 mt-0.5 break-words" },
                            categoriaNome + ' • ' + localizacao
                        ),
                        React.createElement('div', { className: "flex items-center gap-2 mt-2 flex-wrap" },

                    }, "Ver perfil →")

        }

        function BannersPatrocinio() {
            var [banners, setBanners] = useState([
                {
                    id: 1,
                    imagem: 'https://raw.githubusercontent.com/Caerod1980/Imagens-Sem-Limites/38f9bffbdcc0f71c0cfe7d7a7894687bff98e16f/patrocinio4.png', 
                    imagemMobile: 'https://raw.githubusercontent.com/Caerod1980/Imagens-Sem-Limites/38f9bffbdcc0f71c0cfe7d7a7894687bff98e16f/patrocinio4mobile.png',
                    link: 'https://montink.com/o-amor-venceu/',

                    link: 'https://guardianp2p.com.br/',
                    alt: 'Guardian P2P'
                },
                {

                    alt: 'Spotify - Playlist Sem Limites'
                },
                {
                    id: 5,
                    imagem: 'https://raw.githubusercontent.com/Caerod1980/Imagens-Sem-Limites/addc39c39afae03213b0a4a75a87600e65671904/patrocinio5.png',
                    imagemMobile: 'https://raw.githubusercontent.com/Caerod1980/Imagens-Sem-Limites/addc39c39afae03213b0a4a75a87600e65671904/patrocinio5mobile.png',
                    link: 'https://caerod1980.github.io/SemLimites/sobre',
                    alt: 'Promocional - Sem Limites'
                }
            ]);
            
            var [bannerAtual, setBannerAtual] = useState(0);
            var [pausado, setPausado] = useState(false);
            var [progresso, setProgresso] = useState(0);
            var [isMobile, setIsMobile] = useState(false);
            
            useEffect(function() {
                function verificarMobile() {
                    setIsMobile(window.innerWidth < 768);
                }
                verificarMobile();
                window.addEventListener('resize', verificarMobile);
                return function() { window.removeEventListener('resize', verificarMobile); };
            }, []);
            
            var tempoExibicao = 5000;
            
            useEffect(function() {
                if (pausado) return;
                
                var inicio = Date.now();
                var intervaloProgresso = setInterval(function() {
                    var decorrido = Date.now() - inicio;
                    var progressoAtual = (decorrido / tempoExibicao) * 100;
                    if (progressoAtual <= 100) {
                        setProgresso(progressoAtual);
                    }
                }, 50);
                
                var timer = setTimeout(function() {
                    setBannerAtual(function(prev) {
                        return (prev + 1) % banners.length;
                    });
                    setProgresso(0);
                }, tempoExibicao);
                
                return function() {
                    clearTimeout(timer);
                    clearInterval(intervaloProgresso);
                };
            }, [bannerAtual, pausado, banners.length]);
            
            function irParaBanner(indice) {
                setBannerAtual(indice);
                setProgresso(0);
            }
            
            function abrirLinkPatrocinador(link) {
                window.open(link, '_blank');
            }
            
            if (!banners || banners.length === 0) return null;
            
            var banner = banners[bannerAtual];
            var imagemSrc = (isMobile && banner.imagemMobile) ? banner.imagemMobile : banner.imagem;
            var imgClasses = "w-full transition-transform duration-500 group-hover:scale-105";
            
            if (isMobile) {
                imgClasses += " h-auto object-contain bg-gray-900";
            } else {
                imgClasses += " h-[130px] object-contain bg-gray-900";
            }
            
            return React.createElement('div', { 
                className: "w-full overflow-hidden rounded-xl md:rounded-2xl shadow-lg mb-6 md:mb-8 group",
                onMouseEnter: function() { setPausado(true); },
                onMouseLeave: function() { setPausado(false); }

        // ========== COMPONENTE DE LISTAGEM DE SERVIÇOS ==========
        function MeusServicos() {

            var [mostrarForm, setMostrarForm] = useState(false);
            var [filtro, setFiltro] = useState('todos');
            var [copiado, setCopiado] = useState(null);

            function carregarServicos() {
                setLoading(true);
                
                var url = API_URL + '/servicos/meus';
                if (filtro !== 'todos') {
                    url = url + '?status=' + filtro;
                }
                
                fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                })
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        if (data.servicos) {
                            setServicos(data.servicos);
                        }
                        setLoading(false);
                    })
                    .catch(function(error) {
                        console.error('Erro ao carregar serviços:', error);
                        setLoading(false);
                    });
            }

            useEffect(function() {
                carregarServicos();
            }, [filtro]);

            function handleCopiarLink(link) {
                var fullUrl = window.location.origin + BASE_PATH + '/avaliar/' + link.split('/').pop();
                navigator.clipboard.writeText(fullUrl);
                setCopiado(link);
                setTimeout(function() { setCopiado(null); }, 2000);
            }

            function handleEnviarWhatsApp(servico) {
                var fullUrl = window.location.origin + BASE_PATH + '/avaliar/' + servico.avaliacaoToken;
                var mensagem = "Olá " + servico.clienteNome + "! 👋\n\n";
                mensagem = mensagem + "Você contratou " + servico.titulo + " pelo SemLimites.\n\n";
                mensagem = mensagem + "Para avaliar o serviço, acesse o link abaixo e informe seu e-mail cadastrado:\n";
                mensagem = mensagem + fullUrl + "\n\n";
                mensagem = mensagem + "E-mail cadastrado: " + servico.clienteEmail + "\n\n";
                mensagem = mensagem + "Sua avaliação é muito importante para nós! ⭐";
                
                window.open('https://wa.me/' + servico.clienteWhatsApp + '?text=' + encodeURIComponent(mensagem), '_blank');
            }

            function handleReenviarLink(id) {
                fetch(API_URL + '/servicos/' + id + '/reenviar', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                })
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        if (data.linkAvaliacao) {
                            alert('✅ Novo link gerado!');
                            carregarServicos();
                        }
                    })
                    .catch(function(error) {
                        alert('Erro ao gerar novo link');
                    });
            }

            function handleExcluir(id) {
                if (!window.confirm('Tem certeza que deseja excluir este serviço?')) {
                    return;
                }
                
                fetch(API_URL + '/servicos/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                })
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        if (data.message) {
                            alert('✅ Serviço excluído!');
                            carregarServicos();
                        }
                    })

                        alert('Erro ao excluir serviço');

        // ========== TELA DE LOGIN ==========
        function Login(props) {
            var onLoginSuccess = props.onLoginSuccess;
            var onVoltar = props.onVoltar;
            
            var [email, setEmail] = useState('');
            var [senha, setSenha] = useState('');
            var [tipo, setTipo] = useState('cliente');
            var [modo, setModo] = useState('login');
            var [loading, setLoading] = useState(false);
            var [erro, setErro] = useState('');

            function handleSubmit(e) {
                e.preventDefault();
                setLoading(true);
                setErro('');

                var url = API_URL;
                var body = {};

                if (modo === 'login') {
                    url = url + '/auth/login';
                    body = { email: email, senha: senha, tipo: tipo };
                } else {
                    url = url + '/auth/register';
                    body = { email: email, senha: senha, tipo: tipo, nome: email.split('@')[0] };
                }

                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                })
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        if (data.error) {
                            throw new Error(data.error);
                        }

                        if (modo === 'login') {
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('user', JSON.stringify(data.user));
                            
                            var prestadorParaCurtir = sessionStorage.getItem('curtirAposLogin');
                            if (prestadorParaCurtir && data.user.tipo === 'cliente') {
                                sessionStorage.removeItem('curtirAposLogin');
                                onLoginSuccess(data.user, prestadorParaCurtir);
                            } else {
                                onLoginSuccess(data.user);
                            }
                        } else {
                            alert('Cadastro realizado! Faça login.');
                            setModo('login');
                        }
                        setLoading(false);
                    })
                    .catch(function(error) {
                        setErro(error.message);
                        setLoading(false);
                    });

            var radioButtons = [];

        // ========== TELA RESETAR SENHA ==========
        function ResetarSenha(props) {

                            )

                        }, "Voltar ao login")
                    )
                );

            return React.createElement('div', { className: "max-w-md mx-auto px-4 py-8" },

                    React.createElement('div', { className: "flex items-center justify-between mb-6" },
                        React.createElement('h1', { className: "text-xl font-bold text-[#3d7a3d]" }, "Nova senha"),
                        React.createElement('button', { 
                            onClick: onVoltar, 
                            className: "text-sm text-[#4a8a4a] hover:text-[#2d5a2d]" 
                        }, "← Voltar")
                    ),

                    email && React.createElement('div', { className: "mb-4 p-3 rounded-lg bg-[#f0f7f0] border border-[#c0dfc0]" },
                        React.createElement('p', { className: "text-sm text-[#2d5a2d]" },
                            "Redefinindo senha para: ",

                        )
                    ),

                    erro && React.createElement('div', { className: "mb-4 p-3 rounded-lg bg-red-50 border border-red-200" },
                        React.createElement('p', { className: "text-sm text-red-600" }, erro)
                    ),

                    React.createElement('form', { onSubmit: handleSubmit, className: "space-y-4" },

                            React.createElement('input', {

                                className: "w-full px-3 py-2 rounded-lg border border-[#c0dfc0] focus:border-[#FFB347] focus:ring focus:ring-[#FFD966]/30"
                            })
                        ),

                        React.createElement('div', null,
                            React.createElement('label', { className: "block text-xs font-medium mb-1 text-[#3d7a3d]" }, "Confirmar senha"),
                            React.createElement('input', {
                                type: "password",
                                value: confirmarSenha,
                                onChange: function(e) { setConfirmarSenha(e.target.value); },
                                required: true,
                                minLength: 6,
                                className: "w-full px-3 py-2 rounded-lg border border-[#c0dfc0] focus:border-[#FFB347] focus:ring focus:ring-[#FFD966]/30"
                            })
                        ),

                        React.createElement('button', {
                            type: "submit",
                            disabled: enviando,
                            className: "w-full px-4 py-2 bg-gradient-to-r from-[#FFB347] to-[#FFD966] text-white rounded-lg disabled:opacity-50"

        // ========== TELA DE CADASTRO COM PAGAMENTO (FLUXO CORRETO) ==========
        function CadastroPrestador(props) {
            var onCadastroSucesso = props.onCadastroSucesso;
            var onVoltar = props.onVoltar;
            
            var [categorias, setCategorias] = useState([]);
            var [servicos, setServicos] = useState([]);
            var [categoriaSelecionada, setCategoriaSelecionada] = useState('');
            var [servicosSelecionados, setServicosSelecionados] = useState([]);
            
            var [formData, setFormData] = useState({
                nome: '', 
                email: '', 
                senha: '',
                confirmarSenha: '',
                tipoPessoa: 'juridica',
                cpf: '',
                cnpj: '', 
                responsavel: '',
                cidade: '',
                estado: 'SP',
                whatsapp: '', 
                telefone: '', 
                descricao: '', 
                tags: ''
            });
            
            var [etapa, setEtapa] = useState('form');
            var [verificacaoCNPJ, setVerificacaoCNPJ] = useState(null);
            var [loading, setLoading] = useState(false);
            var [erro, setErro] = useState('');
            
            var [aceitouTermos, setAceitouTermos] = useState(false);
            var [linkPagamento, setLinkPagamento] = useState(null);
            var [preferenceId, setPreferenceId] = useState(null);
            var [mp, setMp] = useState(null);
            var [carregandoMP, setCarregandoMP] = useState(false);
            var [emailVerificado, setEmailVerificado] = useState(false);
            var [cnpjVerificadoExistente, setCnpjVerificadoExistente] = useState(false);
            var [dadosPendentes, setDadosPendentes] = useState(null);
            var [monitoramentoAtivo, setMonitoramentoAtivo] = useState(false);

            var erroElement = null;
            if (erro) {
                erroElement = React.createElement('div', { className: "mb-4 p-3 rounded-lg bg-red-50 border border-red-200" },
                    React.createElement('p', { className: "text-sm text-red-600" }, erro)
                );
            }

            function verificarEmail() {
                if (!formData.email || formData.email.length < 5) return;
                
                setErro('');
                fetch(API_URL + '/auth/verificar-email?email=' + encodeURIComponent(formData.email))
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        if (data.existe) {
                            setErro('Este e-mail já está cadastrado. Use outro e-mail ou faça login.');
                            setEmailVerificado(false);
                        } else {
                            setEmailVerificado(true);
                        }
                    })
                    .catch(function(error) {
                        console.error('Erro ao verificar e-mail:', error);
                    });
            }

            function verificarCNPJExistente() {
                if (!formData.cnpj || formData.tipoPessoa !== 'juridica') return;
                
                var cnpjNumeros = formData.cnpj.replace(/\D/g, '');
                if (cnpjNumeros.length !== 14) return;
                
                fetch(API_URL + '/auth/verificar-cnpj?cnpj=' + cnpjNumeros)
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        if (data.existe) {
                            setErro('Este CNPJ já está cadastrado no sistema.');
                            setCnpjVerificadoExistente(false);
                        } else {
                            setCnpjVerificadoExistente(true);
                        }
                    })
                    .catch(function(error) {
                        console.error('Erro ao verificar CNPJ:', error);
                    });
            }

            useEffect(function() {
                fetch(API_URL + '/categorias/principais')
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        setCategorias(data);
                    })
                    .catch(function(err) {
                        console.error('Erro ao carregar categorias:', err);
                    });
            }, []);

            useEffect(function() {
                if (categoriaSelecionada) {
                    fetch(API_URL + '/categorias/' + categoriaSelecionada + '/servicos')
                        .then(function(response) { return response.json(); })
                        .then(function(data) {
                            setServicos(data);
                            setServicosSelecionados([]);
                        })
                        .catch(function(err) {
                            console.error('Erro ao carregar serviços:', err);
                        });
                } else {
                    setServicos([]);
                    setServicosSelecionados([]);
                }
            }, [categoriaSelecionada]);

            // Detectar retorno do Mercado Pago
            useEffect(function() {
                console.log('🔍 [Cadastro] Verificando retorno do Mercado Pago...');
                
                const urlParams = new URLSearchParams(window.location.search);
                const retorno = urlParams.get('retorno');
                
                console.log('🔍 [Cadastro] Parâmetro retorno:', retorno);
                
                if (retorno === 'sucesso') {
                    console.log('✅ [Cadastro] Retorno do Mercado Pago detectado! Status: sucesso');
                    
                    const preferenceIdSalvo = sessionStorage.getItem('preferenceId');
                    const dadosSalvos = sessionStorage.getItem('cadastroPendente');
                    
                    console.log('🔍 [Cadastro] preferenceId salvo:', preferenceIdSalvo ? 'SIM' : 'NÃO');
                    console.log('🔍 [Cadastro] dadosSalvos:', dadosSalvos ? 'SIM' : 'NÃO');
                    
                    if (preferenceIdSalvo && dadosSalvos) {
                        console.log('📦 [Cadastro] Dados encontrados, iniciando verificação do pagamento...');
                        iniciarMonitoramentoPagamento();
                    } else {
                        console.error('❌ [Cadastro] Nenhum dado encontrado no sessionStorage');
                        setErro('Erro ao processar retorno. Entre em contato com o suporte.');
                        setEtapa('form');
                    }
                    
                    window.history.replaceState({}, document.title, window.location.pathname);
                } else if (retorno === 'erro') {
                    setErro('Ocorreu um erro no pagamento. Tente novamente.');
                    setEtapa('form');
                } else if (retorno === 'pending') {
                    setErro('Pagamento pendente. Aguarde e tente novamente.');
                    setEtapa('form');
                }
            }, []);

            function iniciarMonitoramentoPagamento() {
                const preferenceId = sessionStorage.getItem('preferenceId');

                if (!preferenceId) {
                    console.error('❌ PreferenceId não encontrado');
                    return;
                }

                if (monitoramentoAtivo) {
                    console.log('⚠️ Monitoramento já ativo, ignorando nova tentativa');
                    return;
                }

                console.log('🔍 Monitorando pagamento:', preferenceId);

                if (window.monitoramentoInterval) {
                    clearInterval(window.monitoramentoInterval);
                }

                setMonitoramentoAtivo(true);

                let tentativas = 0;
                const maxTentativas = 20;

                window.monitoramentoInterval = setInterval(async () => {
                    tentativas++;

                    console.log(`🔄 Tentativa ${tentativas}/${maxTentativas}`);

                    try {
                        const res = await fetch(API_URL + '/assinatura/status-preferencia/' + preferenceId);
                        const data = await res.json();

                        console.log('📊 Status:', data);

                        if (data.status === 'approved' || data.pagamentoConfirmado === true) {
                            console.log('✅ PAGAMENTO CONFIRMADO');

                            clearInterval(window.monitoramentoInterval);
                            window.monitoramentoInterval = null;
                            setMonitoramentoAtivo(false);

                            criarPrestadorAposPagamento();
                        }

                        if (tentativas >= maxTentativas) {
                            clearInterval(window.monitoramentoInterval);
                            window.monitoramentoInterval = null;
                            setMonitoramentoAtivo(false);

                            console.error('⏰ Timeout pagamento');

                            setErro('Pagamento não confirmado. Contate suporte.');
                            setEtapa('form');
                        }

                    } catch (err) {
                        console.error('❌ Erro monitoramento:', err);
                    }

                }, 3000);
            }

            function criarPrestadorAposPagamento() {
                console.log('🚀 FUNÇÃO criarPrestadorAposPagamento FOI CHAMADA!');
                
                var dadosSalvos = sessionStorage.getItem('cadastroPendente');
                
                if (!dadosSalvos) {
                    console.error('❌ Dados de cadastro não encontrados no sessionStorage');
                    setErro('Erro ao finalizar cadastro. Entre em contato com o suporte.');
                    setEtapa('form');
                    return;
                }
                
                var dados = JSON.parse(dadosSalvos);
                console.log('📦 Dados recuperados:', { nome: dados.nome, email: dados.email, preferenceId: dados.preferenceId });
                
                var dadosEnvio = {
                    nome: dados.nome,
                    email: dados.email,
                    senha: dados.senha,
                    tipo: 'prestador',
                    tipoPessoa: dados.tipoPessoa,
                    cidade: dados.cidade,
                    estado: dados.estado,
                    whatsapp: dados.whatsapp,
                    telefone: dados.telefone || '',
                    descricao: dados.descricao || '',
                    tags: dados.tags || [],
                    categoriaPrincipal: dados.categoriaPrincipal,
                    servicos: dados.servicos,
                    aceitouTermos: true,
                    preferenceId: dados.preferenceId,
                    planoStatus: 'ativo',
                    planoAtivo: true,
                    assinaturaAtivadaEm: new Date().toISOString()
                };
                
                if (dados.tipoPessoa === 'fisica') {
                    dadosEnvio.cpf = dados.cpf;
                } else {
                    dadosEnvio.cnpj = dados.cnpj;
                    dadosEnvio.responsavel = dados.responsavel;
                    if (dados.cnpjVerificado) {
                        dadosEnvio.cnpjVerificado = true;
                        dadosEnvio.razaoSocialVerificada = dados.razaoSocialVerificada;
                    }
                }
                
                console.log('📤 Enviando requisição para /auth/register');
                
                fetch(API_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosEnvio)
                })
                    .then(function(response) { 
                        if (!response.ok) {
                            return response.json().then(function(err) { 
                                throw new Error(err.error || 'Erro no cadastro'); 
                            });
                        }
                        return response.json(); 
                    })
                    .then(function(registerData) {
                        if (registerData.error) {
                            throw new Error(registerData.error);
                        }
                        
                        console.log('✅ Prestador cadastrado com sucesso após pagamento!');
                        console.log('📋 Dados do prestador:', registerData.user);
                        
                        localStorage.setItem('token', registerData.token);
                        localStorage.setItem('user', JSON.stringify(registerData.user));
                        
                        sessionStorage.removeItem('cadastroPendente');
                        sessionStorage.removeItem('preferenceId');
                        setDadosPendentes(null);
                        
                        setEtapa('sucesso');
                        setLoading(false);
                        
                        setTimeout(function() {
                            navigate('/dashboard');
                        }, 2000);
                    })
                    .catch(function(error) {
                        console.error('❌ Erro no cadastro pós-pagamento:', error);
                        setErro('Erro ao finalizar cadastro. Entre em contato com o suporte.');
                        setEtapa('form');
                    });
            }

            function formatarCPF(valor) {
                var numeros = valor.replace(/\D/g, '');
                if (numeros.length <= 11) {
                    return numeros.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
                }
                return valor;
            }

            function formatarCNPJ(valor) {
                var numeros = valor.replace(/\D/g, '');
                if (numeros.length <= 14) {
                    return numeros.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
                }
                return valor;
            }

            function formatarWhatsApp(valor) {
                var numeros = valor.replace(/\D/g, '');
                if (numeros.length <= 11) {
                    return numeros.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
                }
                return valor;
            }

            function handleChange(e) {
                var name = e.target.name;
                var value = e.target.value;
                
                if (name === 'cpf') {
                    setFormData({ ...formData, cpf: formatarCPF(value) });
                } else if (name === 'cnpj') {
                    setFormData({ ...formData, cnpj: formatarCNPJ(value) });
                } else if (name === 'whatsapp') {
                    setFormData({ ...formData, whatsapp: formatarWhatsApp(value) });
                } else {
                    setFormData({ ...formData, [name]: value });
                }
            }

            function verificarCNPJ() {
                var cnpjNumeros = formData.cnpj.replace(/\D/g, '');
                if (cnpjNumeros.length !== 14) {
                    setErro('CNPJ inválido. Deve conter 14 dígitos.');
                    return;
                }

                setErro('');
                setVerificacaoCNPJ('verificando');

                fetch(API_URL + '/prestadores/verificar-cnpj', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cnpj: formData.cnpj })
                })
                .then(function(response) { 
                    if (!response.ok) {
                        return response.json().then(function(err) {
                            throw new Error(err.motivo || 'Erro na consulta');
                        });
                    }
                    return response.json(); 
                })
                .then(function(data) {
                    if (data.valido) {
                        setVerificacaoCNPJ({

        // ========== PAINEL ADMINISTRATIVO ==========
        function PainelAdmin(props) {
            var onSair = props.onSair;
            var [stats, setStats] = useState({ clientes: 0, prestadores: 0, avaliacoes: 0, servicos: 0 });
            var [prestadoresPorCidade, setPrestadoresPorCidade] = useState([]);
            var [buscaPrestador, setBuscaPrestador] = useState('');
            var [resultadoPrestador, setResultadoPrestador] = useState(null);
            var [buscaCliente, setBuscaCliente] = useState('');
            var [resultadoCliente, setResultadoCliente] = useState(null);
            var [ultimasAvaliacoes, setUltimasAvaliacoes] = useState([]);
            var [loading, setLoading] = useState(true);
            var [excluindo, setExcluindo] = useState(false);

            function carregarDados() {
                setLoading(true);
                var token = localStorage.getItem('token');
                var headers = { 'Authorization': 'Bearer ' + token };
                
                Promise.all([
                    fetch(API_URL + '/admin/stats', { headers }).then(r => r.json()).catch(() => ({ clientes: 0, prestadores: 0, avaliacoes: 0, servicos: 0 })),
                    fetch(API_URL + '/admin/prestadores-por-cidade', { headers }).then(r => r.json()).catch(() => []),
                    fetch(API_URL + '/admin/avaliacoes-recentes?limit=10', { headers }).then(r => r.json()).catch(() => [])
                ]).then(function([statsData, cidadesData, avaliacoesData]) {
                    setStats(statsData);
                    setPrestadoresPorCidade(cidadesData);
                    setUltimasAvaliacoes(avaliacoesData);
                    setLoading(false);
                }).catch(function(err) {
                    console.error('Erro ao carregar dados admin:', err);
                    setLoading(false);
                });
            }

            useEffect(function() { carregarDados(); }, []);

            function buscarPrestadorHandler() {
                if (!buscaPrestador.trim()) return;
                var token = localStorage.getItem('token');
                fetch(API_URL + '/admin/buscar-prestador?q=' + encodeURIComponent(buscaPrestador), { headers: { 'Authorization': 'Bearer ' + token } })
                    .then(function(r) { return r.json(); })
                    .then(function(data) { 
                        if (data.encontrado) setResultadoPrestador(data.prestador); 
                        else { alert(data.mensagem || 'Prestador não encontrado'); setResultadoPrestador(null); } 
                    })
                    .catch(function(err) { console.error(err); alert('Erro ao buscar prestador'); });
            }

            function buscarClienteHandler() {
                if (!buscaCliente.trim()) return;
                var token = localStorage.getItem('token');
                fetch(API_URL + '/admin/buscar-cliente?email=' + encodeURIComponent(buscaCliente), { headers: { 'Authorization': 'Bearer ' + token } })
                    .then(function(r) { return r.json(); })
                    .then(function(data) { 
                        if (data.encontrado) setResultadoCliente(data.cliente); 
                        else { alert(data.mensagem || 'Cliente não encontrado'); setResultadoCliente(null); } 
                    })
                    .catch(function(err) { console.error(err); alert('Erro ao buscar cliente'); });

                                React.createElement('li', null, React.createElement('button', { onClick: function() { handleNavigate('/privacidade'); }, className: "text-xs md:text-sm text-slate-600 hover:text-[#3d7a3d] transition" }, "Política de Privacidade")),
                                React.createElement('li', null, React.createElement('button', { onClick: function() { handleNavigate('/cookies'); }, className: "text-xs md:text-sm text-slate-600 hover:text-[#3d7a3d] transition" }, "Política de Cookies"))
                            )
                        ),
                        React.createElement('div', null,
                            React.createElement('h3', { className: "font-semibold text-[#3d7a3d] mb-3 text-sm md:text-base" }, "Prestadores"),
                            React.createElement('ul', { className: "space-y-2" },
                                React.createElement('li', null, React.createElement('button', { onClick: function() { handleNavigate('/cadastro'); }, className: "text-xs md:text-sm text-slate-600 hover:text-[#3d7a3d] transition" }, "Quero ser Prestador")),
                                React.createElement('li', null, React.createElement('button', { onClick: function() { handleNavigate('/sobre-dashboard-prestador'); }, className: "text-xs md:text-sm text-slate-600 hover:text-[#3d7a3d] transition" }, "Área do Prestador")),
                                React.createElement('li', null, React.createElement('button', { onClick: function() { handleNavigate('/faq-prestador'); }, className: "text-xs md:text-sm text-slate-600 hover:text-[#3d7a3d] transition" }, "FAQ para Prestadores"))
                            )
                        ),
                        React.createElement('div', null,
                            React.createElement('h3', { className: "font-semibold text-[#3d7a3d] mb-3 text-sm md:text-base" }, "Clientes"),
                            React.createElement('ul', { className: "space-y-2" },
                                React.createElement('li', null, React.createElement('button', { onClick: function() { handleNavigate('/'); }, className: "text-xs md:text-sm text-slate-600 hover:text-[#3d7a3d] transition" }, "Buscar Profissionais")),
                                React.createElement('li', null, React.createElement('button', { onClick: function() { handleNavigate('/meus-favoritos'); }, className: "text-xs md:text-sm text-slate-600 hover:text-[#3d7a3d] transition" }, "Meus Favoritos")),
                                React.createElement('li', null, React.createElement('button', { onClick: function() { handleNavigate('/faq-cliente'); }, className: "text-xs md:text-sm text-slate-600 hover:text-[#3d7a3d] transition" }, "FAQ para Clientes"))
                            )
                        )
                    ),
                    React.createElement('div', { className: "text-center pt-6 border-t border-[#c0dfc0]" },
                        React.createElement('p', { className: "text-xs text-slate-500" }, "© 2026 Sem Limites. Todos os direitos reservados."),
                        React.createElement('p', { className: "text-[10px] text-slate-400 mt-2" }, "CNPJ: 00.000.000/0001-00")
                    )
                ),
                React.createElement('div', { className: "fixed bottom-4 right-4 z-40" },
                    isAdminLoggedIn ?
                        React.createElement('button', { onClick: onAdminLogout, className: "admin-btn text-xs text-red-500 hover:text-red-700 bg-white/80 hover:bg-white rounded-full px-3 py-1.5 shadow-md border border-red-200 transition-all flex items-center gap-1" },
                            React.createElement('span', null, "🛡️"), "Sair Admin"
                        ) :
                        React.createElement('button', { onClick: onOpenAdminModal, className: "admin-btn text-xs text-slate-400 hover:text-red-500 bg-white/80 hover:bg-white rounded-full px-3 py-1.5 shadow-md border border-slate-200 transition-all flex items-center gap-1" },
                            React.createElement('span', null, "🛡️"), "Admin"
                        )
                )
            );
        }

        // ========== APP PRINCIPAL ==========
        function App() {
            var [adminModalOpen, setAdminModalOpen] = useState(false);
            var [modo, setModo] = useState('busca');
            var [usuario, setUsuario] = useState(null);
            var [prestadorSelecionado, setPrestadorSelecionado] = useState(null);
            var [prestadorId, setPrestadorId] = useState(null);

            window.appSetModo = setModo;

            useEffect(function() {
                var path = window.location.pathname;
                console.log('📍 Path atual:', path);
                
                if (path.startsWith('/avaliar/')) {
                    setModo('avaliar');
                } else if (path === '/login') {
                    setModo('login');
                } else if (path === '/cadastro') {
                    setModo('cadastro');
                } else if (path === '/dashboard') {
                    setModo('dashboard');
                } else if (path === '/dashboard-cliente') {
                    setModo('dashboard-cliente');
                } else if (path.startsWith('/perfil/')) {
                    var id = path.split('/')[2];
                    console.log('📌 ID do perfil da URL:', id);
                    if (id) {
                        setPrestadorId(id);
                        setPrestadorSelecionado(null);
                        setModo('perfil');
                    } else {
                        setModo('busca');
                    }
                } else if (path === '/esqueci-senha') {
                    setModo('esqueci-senha');
                } else if (path.startsWith('/resetar-senha/')) {
                    setModo('resetar-senha');
                } else if (path === '/termos') {
                    setModo('termos');
                } else if (path === '/privacidade') {
                    setModo('privacidade');
                } else if (path === '/cookies') {
                    setModo('cookies');
                } else if (path === '/contato') {
                    setModo('contato');
                } else if (path === '/sobre') {
                    setModo('sobre');
                } else if (path === '/como-funciona') {
                    setModo('como-funciona');
                } else if (path === '/faq-prestador') {
                    setModo('faq-prestador');
                } else if (path === '/faq-cliente') {
                    setModo('faq-cliente');
                } else if (path === '/sobre-dashboard-prestador') {
                    setModo('sobre-dashboard-prestador');
                } else if (path === '/meus-favoritos') {
                    setModo('meus-favoritos');
                } else if (path === '/admin') {
                    setModo('admin');
                } else {
                    setModo('busca');
                }
                
                var token = localStorage.getItem('token');
                if (token) {
                    fetch(API_URL + '/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    })
                        .then(function(response) { return response.json(); })
                        .then(function(data) {
                            if (!data.error) {
                                setUsuario(data);
                                localStorage.setItem('user', JSON.stringify(data));
                            }
                        })
                        .catch(function(error) { console.error(error); });
                }
            }, []);

            // CORREÇÃO: Removido o useEffect duplicado que estava causando conflito

            function voltarParaBusca() {
                window.scrollTo(0, 0);
                navigate('/');
                setPrestadorId(null);
                setPrestadorSelecionado(null);
            }

            function handleVerPerfil(prestador) {
                console.log('👤 App recebeu prestador para ver perfil:', prestador.nome);
                setPrestadorSelecionado(prestador);
                setPrestadorId(null);
                navigate('/perfil/' + prestador._id);
            }

            function handleLoginSuccess(userData, prestadorParaCurtir) {
                setUsuario(userData);
                
                if (userData.tipo === 'admin') {
                    navigate('/admin');
                    return;
                }
                
                if (prestadorParaCurtir) {
                    navigate('/perfil/' + prestadorParaCurtir);
                } else if (userData.tipo === 'cliente') {
                    navigate('/dashboard-cliente');
                } else if (userData.tipo === 'prestador') {
                    navigate('/dashboard');
                } else {
                    navigate('/');
                }
            }

            function handleCadastroSucesso() {
                navigate('/');
            }

            function handleSair() {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                setUsuario(null);
                navigate('/');
            }
            
            function handleAdminLogout() {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                setUsuario(null);
                navigate('/');
            }
            
            var header = modo !== 'avaliar' ? React.createElement(Header, {
                usuario: usuario,
                onVoltar: voltarParaBusca,
                onNavigate: navigate
            }) : null;

            var content = null;
            if (modo === 'busca') {
                content = React.createElement(TelaBusca, { onVerPerfil: handleVerPerfil });
            } else if (modo === 'admin') {
                content = React.createElement(PainelAdmin, { onSair: function() { handleAdminLogout(); } });
            } else if (modo === 'perfil') {
                content = React.createElement(TelaPerfil, { 
                    prestador: prestadorSelecionado, 
                    prestadorId: prestadorId,
                    onVoltar: voltarParaBusca 
                });
            } else if (modo === 'login') {
                content = React.createElement(Login, { onLoginSuccess: handleLoginSuccess, onVoltar: voltarParaBusca });
            } else if (modo === 'cadastro') {
                content = React.createElement(CadastroPrestador, { onCadastroSucesso: handleCadastroSucesso, onVoltar: voltarParaBusca });
            } else if (modo === 'dashboard') {
                content = React.createElement(DashboardPrestador, { usuario: usuario, onSair: handleSair });
            } else if (modo === 'dashboard-cliente') {
                content = React.createElement(DashboardCliente, { 
                    usuario: usuario, 
                    onSair: handleSair,
                    onVerPerfil: handleVerPerfil 
                });
            } else if (modo === 'avaliar') {
                content = React.createElement(AvaliarServico);
            } else if (modo === 'esqueci-senha') {
                content = React.createElement(EsqueciSenha, { 
                    onVoltar: voltarParaBusca 
                });
            } else if (modo === 'resetar-senha') {
                content = React.createElement(ResetarSenha, { 
                    onVoltar: voltarParaBusca,
                    onSucesso: function() { navigate('/login'); }
                });
            } else if (modo === 'termos') {
                content = React.createElement(TermosDeUso, { onVoltar: voltarParaBusca });
            } else if (modo === 'privacidade') {
                content = React.createElement(PoliticaPrivacidade, { onVoltar: voltarParaBusca });
            } else if (modo === 'cookies') {
                content = React.createElement(PoliticaCookies, { onVoltar: voltarParaBusca });
            } else if (modo === 'sobre') {
                content = React.createElement(SobreNos, { onVoltar: voltarParaBusca });
            } else if (modo === 'sobre-dashboard-prestador') {
                content = React.createElement(SobreDashboardPrestador, { onVoltar: voltarParaBusca });
            } else if (modo === 'como-funciona') {
                content = React.createElement(ComoFunciona, { onVoltar: voltarParaBusca });
            } else if (modo === 'meus-favoritos') {
                content = React.createElement(MeusFavoritos, { onVoltar: voltarParaBusca });
            } else if (modo === 'contato') {
                content = React.createElement(ContatoSuporte, { onVoltar: voltarParaBusca });
            } else if (modo === 'faq-prestador') {
                content = React.createElement(FaqPrestadores, { onVoltar: voltarParaBusca });
            } else if (modo === 'faq-cliente') {
                content = React.createElement(FaqClientes, { onVoltar: voltarParaBusca });
            } else {
                content = React.createElement('div', { className: "text-center py-12" },
                    React.createElement('div', { className: "w-10 h-10 border-4 border-[#FFD966] border-t-[#FFB347] rounded-full animate-spin mx-auto mb-4" }),
                    React.createElement('p', { className: "text-[#4a8a4a]" }, "Redirecionando...")
                );
            }

            var rodape = modo !== 'avaliar' ? React.createElement(Rodape, { 
                onNavigate: navigate, 
                onOpenAdminModal: function() { setAdminModalOpen(true); },
                isAdminLoggedIn: usuario?.tipo === 'admin',
                onAdminLogout: handleAdminLogout
            }) : null;

            return React.createElement('div', { className: "min-h-screen bg-gradient-to-b from-[#fcf8f3] to-white overflow-guard" },
                header,
                React.createElement('main', null, content),
                rodape,
                React.createElement(ModalLoginAdmin, { 
                    isOpen: adminModalOpen, 
                    onClose: function() { setAdminModalOpen(false); }, 
                    onLoginSuccess: handleLoginSuccess 
                })
            );
        }

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>

    <!-- ===== REGISTRO DO SERVICE WORKER (PWA) ===== -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/SemLimites/sw.js')
                .then(registration => {
                    console.log('✅ Service Worker registrado com sucesso:', registration);
                })
                .catch(error => {
                    console.log('❌ Service Worker falhou:', error);
                });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('📱 App pode ser instalado!');
            
            const installBtn = document.createElement('button');
            installBtn.textContent = '📱 Instalar App';
            installBtn.className = 'fixed bottom-20 right-4 z-50 bg-[#3d7a3d] text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium animate-pulse';
            installBtn.style.cursor = 'pointer';
            installBtn.onclick = () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ Usuário aceitou instalação');
                    } else {
                        console.log('❌ Usuário recusou instalação');
                    }
                    deferredPrompt = null;
                    installBtn.remove();
                });
            };
            document.body.appendChild(installBtn);
            
            setTimeout(() => {
                if (installBtn.parentElement) installBtn.remove();
            }, 10000);
        });
    </script>
</body>
</html>
