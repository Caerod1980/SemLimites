<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SemLimites</title>
  <script>
    (function() {
        var currentUrl = window.location.href;
        var pathname = window.location.pathname;
        var search = window.location.search;
        var params = new URLSearchParams(search);
        
        console.log('📍 404 - URL atual:', currentUrl);
        console.log('📍 Parâmetros:', params.toString());
        
        // Verificar se é um retorno de pagamento
        var retorno = params.get('retorno');
        var preferenceId = params.get('preference_id');
        
        if (retorno === 'sucesso' || retorno === 'erro' || retorno === 'pending') {
            console.log('✅ Retorno de pagamento detectado no 404!');
            
            // IMPORTANTE: Salvar no sessionStorage para o app processar
            if (retorno === 'sucesso') {
                sessionStorage.setItem('pagamentoRetorno', 'sucesso');
                sessionStorage.setItem('preferenceId', preferenceId);
            }
            
            // Redirecionar para a página de cadastro com os parâmetros
            var redirectUrl = '/SemLimites/cadastro' + search;
            console.log('🔄 Redirecionando para:', redirectUrl);
            window.location.href = redirectUrl;
        } 
        // Se já está em /SemLimites/, não redirecionar
        else if (pathname.startsWith('/SemLimites/')) {
            console.log('✅ Já está no caminho correto');
            // Carregar o app normalmente
            if (typeof sessionStorage !== 'undefined') {
                sessionStorage.redirect = currentUrl;
            }
            window.location.href = currentUrl;
        }
        // Outros casos: redirecionar preservando o path
        else {
            var newPath = '/SemLimites' + pathname;
            if (search) {
                newPath = newPath + search;
            }
            console.log('🔄 Redirecionando para:', newPath);
            if (typeof sessionStorage !== 'undefined') {
                sessionStorage.redirect = currentUrl;
            }
            window.location.href = newPath;
        }
    })();
  </script>
</head>
<body>
  <div style="text-align: center; padding: 50px; font-family: sans-serif;">
    <h2>SemLimites</h2>
    <p>Redirecionando...</p>
    <p style="font-size: 12px; color: #666;">Aguarde um momento</p>
  </div>
</body>
</html>
