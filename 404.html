<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SemLimites</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(145deg, #fcf8f3 0%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader {
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0efe0;
      border-top-color: #3d7a3d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      color: #3d7a3d;
      margin: 0 0 10px 0;
      font-size: 1.5rem;
    }
    p {
      color: #4a8a4a;
      margin: 0;
      font-size: 0.875rem;
    }
  </style>
  <script>
    (function() {
      var currentUrl = window.location.href;
      var pathname = window.location.pathname;
      var search = window.location.search;
      
      console.log('📍 404 - URL atual:', currentUrl);
      console.log('📍 Pathname:', pathname);
      console.log('📍 Search:', search);
      
      // CORREÇÃO: Verificar se é uma rota que deve ser preservada (resetar-senha, avaliar, perfil)
      var rotasPreservadas = ['/resetar-senha/', '/avaliar/', '/perfil/'];
      var devePreservar = false;
      
      for (var i = 0; i < rotasPreservadas.length; i++) {
        if (pathname.includes(rotasPreservadas[i])) {
          devePreservar = true;
          console.log('🔐 Rota preservada detectada:', rotasPreservadas[i]);
          break;
        }
      }
      
      // Verificar se é um retorno de pagamento
      var params = new URLSearchParams(search);
      var retorno = params.get('retorno');
      var collectionStatus = params.get('collection_status');
      var preferenceId = params.get('preference_id');
      var paymentId = params.get('payment_id');
      
      console.log('📦 Parâmetros detectados:', {
        retorno: retorno,
        collection_status: collectionStatus,
        preference_id: preferenceId,
        payment_id: paymentId
      });
      
      // Se tem retorno de pagamento, salvar no localStorage e redirecionar
      if (retorno === 'sucesso' || retorno === 'erro' || retorno === 'pending' || collectionStatus === 'approved') {
        console.log('✅ Retorno de pagamento detectado no 404!');
        
        if (retorno === 'sucesso' || collectionStatus === 'approved') {
          localStorage.setItem('pagamentoRetorno', 'sucesso');
        } else if (retorno === 'erro') {
          localStorage.setItem('pagamentoRetorno', 'erro');
        } else if (retorno === 'pending') {
          localStorage.setItem('pagamentoRetorno', 'pending');
        }
        
        if (preferenceId) {
          localStorage.setItem('preferenceId', preferenceId);
        }
        if (paymentId) {
          localStorage.setItem('paymentId', paymentId);
        }
        if (collectionStatus) {
          localStorage.setItem('collectionStatus', collectionStatus);
        }
        
        var allParams = {};
        for (var pair of params.entries()) {
          allParams[pair[0]] = pair[1];
        }
        localStorage.setItem('pagamentoParams', JSON.stringify(allParams));
        
        console.log('💾 Dados salvos no localStorage');
        
        var redirectUrl = '/SemLimites/cadastro' + (search || '');
        console.log('🔄 Redirecionando para cadastro:', redirectUrl);
        window.location.replace(redirectUrl);
        return;
      }
      
      // ===== CORREÇÃO CRÍTICA: Se for rota preservada, CARREGAR O CONTEÚDO VIA AJAX =====
      if (devePreservar) {
        console.log('🔐 Rota preservada, carregando SPA via fetch...');
        
        // Carregar o index.html via fetch e substituir o conteúdo
        fetch('/index.html')
          .then(function(response) { return response.text(); })
          .then(function(html) {
            // Extrair o conteúdo do body e scripts
            var parser = new DOMParser();
            var doc = parser.parseFromString(html, 'text/html');
            var newContent = doc.body.innerHTML;
            var scripts = doc.querySelectorAll('script');
            
            // Substituir o conteúdo do body
            document.body.innerHTML = newContent;
            
            // Executar os scripts do novo conteúdo
            scripts.forEach(function(script) {
              var newScript = document.createElement('script');
              if (script.src) {
                newScript.src = script.src;
              } else {
                newScript.textContent = script.textContent;
              }
              document.body.appendChild(newScript);
            });
            
            // Atualizar a URL no navegador sem recarregar
            history.replaceState(null, '', pathname);
            
            console.log('✅ SPA carregado com sucesso para:', pathname);
          })
          .catch(function(error) {
            console.error('❌ Erro ao carregar SPA:', error);
            // Fallback: redirecionar para a raiz
            window.location.replace('/');
          });
        return;
      }
      
      // Verificar se já está na raiz
      if (pathname === '/' || pathname === '/index.html' || pathname === '') {
        console.log('✅ Já está na raiz, carregando normalmente');
        return;
      }
      
      // Para qualquer outro caminho, redirecionar para a raiz
      var redirectUrl = '/' + (search || '');
      console.log('🔄 Redirecionando para raiz:', redirectUrl);
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h2>SemLimites</h2>
    <p>Carregando...</p>
  </div>
</body>
</html>
