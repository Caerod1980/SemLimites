<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SemLimites</title>
  <script>
    (function() {
        var currentUrl = window.location.href;
        var pathname = window.location.pathname;
        var search = window.location.search;
        
        console.log('📍 404 - URL atual:', currentUrl);
        
        // Verificar se é um retorno de pagamento
        var params = new URLSearchParams(search);
        var retorno = params.get('retorno');
        
        if (retorno === 'sucesso' || retorno === 'erro' || retorno === 'pending') {
            console.log('✅ Retorno de pagamento detectado no 404!');
            
            // Salvar no sessionStorage para o app processar
            sessionStorage.setItem('pagamentoRetorno', retorno);
            sessionStorage.setItem('preferenceId', params.get('preference_id'));
            sessionStorage.setItem('paymentId', params.get('payment_id'));
            sessionStorage.setItem('collectionStatus', params.get('collection_status'));
            
            // Salvar todos os parâmetros para debug
            sessionStorage.setItem('pagamentoParams', JSON.stringify(Object.fromEntries(params)));
        }
        
        // SEMPRE redirecionar para o index.html (que processará a rota)
        // O index.html vai ler o pathname e decidir qual componente renderizar
        var redirectUrl = '/SemLimites/' + (search || '');
        
        // Se já está tentando acessar o index, não redirecionar em loop
        if (pathname === '/SemLimites/' || pathname === '/SemLimites/index.html') {
            return;
        }
        
        console.log('🔄 Redirecionando para:', redirectUrl);
        
        // Salvar a URL original para o app
        sessionStorage.redirect = currentUrl;
        
        // Redirecionar
        window.location.href = redirectUrl;
    })();
  </script>
</head>
<body>
  <div style="text-align: center; padding: 50px; font-family: sans-serif;">
    <h2>SemLimites</h2>
    <p>Carregando...</p>
  </div>
</body>
</html>
